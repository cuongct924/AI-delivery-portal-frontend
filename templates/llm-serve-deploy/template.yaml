apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: llm-serve-deploy
  title: 'Serve LLM (Self-hosted)'
  description: >
    Deploy a self-hosted LLM (vLLM on KServe) from a HuggingFace Hub model id.
  tags:
    - llmops
    - llm-serving
  links:
    - title: Troubleshooting FAQ
      url: http://localhost:3000/docs/default/system/ai-delivery-portal/troubleshooting-faq

spec:
  owner: user:guest
  type: service

  parameters:
    # Model + Compute share ONE wizard step on purpose: Backstage isolates
    # each parameters entry's formData to its own step, and the live panels
    # below are cross-field (the GPU suggestion needs huggingFaceModelId's
    # param count AND quantization/maxContextLength together). Split across
    # two steps, GpuRecommendationPanel would never see the model id and
    # would render nothing. Visual separation still comes from StepLayout
    # groups, same as evaluate-deploy-model's single-step / multi-group layout.
    - title: Model & Compute
      description: >
        Pick a model and the GPU it runs on. The GPU suggestion panel sizes
        VRAM from the model you choose — start there, then tune the advanced
        options only if you need to.
      required:
        - modelName
        - huggingFaceModelId
        - gpuType
      properties:
        modelPreset:
          title: Model preset
          type: string
          enum:
            - custom
            - llama-3.1-8b-instruct
            - llama-3.1-70b-instruct
            - qwen2.5-7b-instruct
            - qwen2.5-32b-instruct
            - mistral-7b-instruct
            - mixtral-8x7b-instruct
            - gemma-2-9b-it
            - phi-3.5-mini-instruct
          default: custom
          description: >
            Pick a verified model to auto-fill the HuggingFace id, name and a
            fitting compute profile — or "Custom" to type your own.
        modelName:
          title: Model name
          type: string
          default: llama-3-8b-instruct
          description: E.g. "llama-3-8b-instruct"
        huggingFaceModelId:
          title: HuggingFace Hub model id
          type: string
          default: meta-llama/Llama-3.1-8B-Instruct
          description: E.g. "meta-llama/Llama-3.1-8B-Instruct"
        hfTokenSecretRef:
          title: HF token Secret name
          type: string
          default: hf-token
          description: >
            K8s Secret NAME holding the HuggingFace token (not the token).
            Required only for gated models.
        runtime:
          title: Serving runtime
          type: string
          enum: [vllm, tensorrt-llm, triton]
          default: vllm
          description: >
            vLLM is the only runtime that runs today; TensorRT-LLM and Triton
            are roadmap.
        gpuType:
          title: GPU type
          type: string
          enum: [L4, L40S, A100, H100, H200, B200]
          default: L4
        gpuCount:
          title: GPU count
          type: integer
          enum: [1, 2, 4, 8]
          default: 1
          description: Also used as vLLM's --tensor-parallel-size.
        quantization:
          title: Quantization
          type: string
          enum: [none, fp8, int8, int4-awq]
          default: none
          description: >
            Not every GPU supports every value (A100 has no FP8, B200 no INT8).
            The list narrows once a GPU type is picked.
        maxContextLength:
          title: Max context length (tokens)
          type: integer
          default: 4096

        # Optimization flags — only a subset supported per runtime in MVP.
        # validate_runtime_optimizations() rejects unsupported flags with a clear
        # error. The form shows all flags; backend enforces what actually works.
        batchingStrategy:
          title: Batching strategy
          type: string
          enum: [static, dynamic, continuous]
          default: continuous
          description: >
            vLLM's batching strategy. "continuous" (default) enables continuous
            batching (PagedAttention) which is vLLM's default and recommended.
        enablePagedAttention:
          title: Enable PagedAttention
          type: boolean
          default: true
          description: >
            vLLM's PagedAttention (KV cache paging). Enabled by default —
            disabling is rarely needed and mainly for debugging.
        enablePrefixCaching:
          title: Enable prefix caching
          type: boolean
          default: true
          description: >
            vLLM's automatic prefix caching for shared prompts. Enabled by default.
        speculativeDecoding:
          title: Speculative decoding
          type: string
          enum: [none, ngram, draft-model]
          default: none
          description: >
            Speculative decoding mode. "none" (default) disables; "ngram" uses
            vLLM's built-in n-gram proposer (no draft model); "draft-model"
            requires draftModelId below.
        draftModelId:
          title: Draft model ID (for speculative decoding)
          type: string
          default: meta-llama/Llama-3.2-1B-Instruct
          description: >
            HuggingFace model ID of the draft model when speculativeDecoding=draft-model.
        pipelineParallelSize:
          title: Pipeline parallel size
          type: integer
          default: 1
          description: >
            Number of pipeline parallel stages (vLLM --pipeline-parallel-size).
            >1 splits model across multiple GPUs.
      allOf:
        - if:
            properties:
              gpuType:
                const: A100
          then:
            properties:
              quantization:
                enum: [none, int8, int4-awq]
        - if:
            properties:
              gpuType:
                const: B200
          then:
            properties:
              quantization:
                enum: [none, fp8, int4-awq]
        # Conditionally show speculative decoding fields
        - if:
            properties:
              speculativeDecoding:
                const: draft-model
          then:
            required: [draftModelId]
      ui:field: StepLayout
      ui:options:
        groups:
          - title: Model
            icon: apps
            fields:
              # Curated presets first: picking one fills the HF id + name AND
              # a fitting compute profile, so a Dev doesn't have to know a 70B
              # needs 4x A100 with int4-awq. "Custom" leaves the fields alone.
              - name: modelPreset
                modelPresetPicker: true
              - name: modelName
                width: 6
                rolloutEligibilityGate: true
              - name: huggingFaceModelId
                width: 6
                huggingFaceModelValidator: true
                # Autocomplete of real HF ids (free-solo), so a typo'd id is
                # rare; picking one auto-fills modelName (org stripped,
                # lowercased), which the Dev can still edit.
                huggingFaceModelPicker: true
                autoFillModelName: true
              - name: hfTokenSecretRef
                width: 6
                # Dropdown of real K8s Secret names (GET /secrets) — a typo'd
                # name leaves the pod stuck pulling a gated model.
                secretPicker: true
              - name: runtime
                width: 6
          - title: Compute
            icon: memory
            fields:
              - name: gpuType
                width: 6
                gpuRecommendationPanel: true
              - name: gpuCount
                width: 6
              - name: quantization
                width: 6
              - name: maxContextLength
                width: 6
          - title: Optimization (Advanced)
            icon: speed
            fields:
              - name: batchingStrategy
                width: 6
              - name: enablePagedAttention
                width: 6
              - name: enablePrefixCaching
                width: 6
              - name: speculativeDecoding
                width: 6
              - name: draftModelId
                width: 6
              - name: pipelineParallelSize
                width: 6

    - title: Strategy & Release
      description: >
        How the new version takes traffic, and whether it ships via a PR or
        deploys instantly. Canary/A-B/Blue-Green need a prior deploy of this
        model.
      properties:
        deployStrategy:
          title: Deploy strategy
          type: string
          enum: [direct, canary, ab, blue-green]
          default: direct
          description: >
            Direct always works. Canary/A-B/Blue-Green need a prior deploy of
            this model (see the eligibility panel on the Model step).
        trafficPercent:
          title: Traffic percent
          type: integer
          default: 10
          description: Required unless deployStrategy is Direct.
        environment:
          title: Environment
          type: string
          enum: [dev, staging, prod]
          default: dev
          description: >
            Instant releases are dev-only — staging/prod narrow releaseStrategy
            to pr-gated.
        releaseStrategy:
          title: Release strategy
          type: string
          enum: [pr-gated, instant]
          default: pr-gated
          description: >
            PR-gated opens a PR against repoUrl. Instant calls the API
            directly (no PR) and needs environment=dev + the llm-ops-admin
            role.
      allOf:
        # Instant is dev-only — static (environment lives in this same step,
        # so allOf can see it). The rollout gate (prior deploy?) is live API
        # data and deliberately NOT narrowed here; the backend owns that
        # rejection.
        - if:
            properties:
              environment:
                const: dev
          then:
            properties:
              releaseStrategy:
                enum: [pr-gated, instant]
          else:
            properties:
              releaseStrategy:
                enum: [pr-gated]
        - if:
            properties:
              deployStrategy:
                const: direct
          then:
            properties: {}
          else:
            required:
              - trafficPercent
            properties: {}
      ui:field: StepLayout
      ui:options:
        groups:
          - title: Deploy strategy
            icon: tune
            fields:
              - deployStrategy
              - trafficPercent
          - title: Release
            icon: launch
            fields:
              - name: environment
                width: 6
              - name: releaseStrategy
                width: 6
                # instant needs the llm-ops-admin role server-side; the panel
                # warns and the form falls back to pr-gated when it's missing,
                # so the run can't 403 at prepare time.
                releaseEligibilityPanel: true

    - title: Repository
      description: >
        Where the deploy manifest PR is opened. Only used for pr-gated
        releases.
      properties:
        repoUrl:
          title: Repository
          type: string
          default: github.com?owner=cuongct924&repo=backstage-plugins
          description: >
            Target GitOps repo, format github.com?owner=<org>&repo=<repo>.
            Required when releaseStrategy is pr-gated.
        # Pre-flight FinOps panel (StepLayoutField's costEstimate flag) —
        # calls the same /costs/estimate + /costs/check the estimate-cost/
        # cost-gate steps below call at submit time. Its own value is never
        # read; only its group placement matters.
        costEstimate:
          title: Cost estimate
          type: string
          readOnly: true
          # Carries the golden path name so the Review step can resolve the
          # same estimate config; the panel itself reads its ui:options.
          default: llm-serve-deploy
          description: Computed automatically — nothing to fill in.
        # Security control surface (StepLayoutField's securityScan flag) —
        # the platform is the trust boundary: these controls are scanned
        # before the manifest is rendered, and a blocking finding stops the
        # run. Defaults are secure-by-default; a Dev opts out deliberately.
        inputGuardrails:
          title: Input guardrails
          type: boolean
          default: true
          description: Sanitize and length-bound every prompt before inference.
        outputGuardrails:
          title: Output guardrails
          type: boolean
          default: true
          description: Filter model output for leakage and hallucination markers.
        injectionDetection:
          title: Prompt-injection detection
          type: boolean
          default: true
          description: Detect prompt-injection in live inference streams.
        tenantNamespace:
          title: Tenant namespace
          type: string
          default: default
          description: Namespace boundary the serving workload is isolated to.
        auditLogging:
          title: Inference audit trail
          type: boolean
          default: true
          description: Record every inference with actor, input hash and output.
        contextBoundary:
          title: Context boundary (tokens)
          type: integer
          default: 4096
          description: Cap the context window so retrieved text can't overrun it.
        encryptionAtRest:
          title: Encryption at rest
          type: boolean
          default: true
          description: Encrypt the model artifact at rest, not only in transit.
        explainability:
          title: Explainability
          type: boolean
          default: false
          description: Attach reasoning/attribution to each audited inference.
        # Pre-flight security panel — calls the same /security/scan the
        # security-scan step below calls at submit time. Its own value is
        # never read; only its group placement matters.
        securityScan:
          title: Security posture
          type: string
          readOnly: true
          default: llm-serve-deploy
          description: Computed automatically — nothing to fill in.
      ui:field: StepLayout
      ui:options:
        groups:
          - title: Repository
            icon: list
            fields:
              - repoUrl
          - title: Security
            icon: security
            fields:
              - name: inputGuardrails
                width: 6
              - name: outputGuardrails
                width: 6
              - name: injectionDetection
                width: 6
              - name: tenantNamespace
                width: 6
              - name: auditLogging
                width: 6
              - name: contextBoundary
                width: 6
              - name: encryptionAtRest
                width: 6
              - name: explainability
                width: 6
              - name: securityScan
                securityScan:
                  goldenPath: llm-serve-deploy
                  stage: run
                  artifactFields: [modelName]
                  paramFields:
                    [
                      inputGuardrails,
                      outputGuardrails,
                      injectionDetection,
                      tenantNamespace,
                      auditLogging,
                      contextBoundary,
                      encryptionAtRest,
                      explainability,
                    ]
          - title: Cost estimate
            icon: attach_money
            fields:
              - name: costEstimate
                costEstimate:
                  goldenPath: llm-serve-deploy
                  stage: run
                  artifactFields: [modelName]
                  paramFields: [gpuType, gpuCount]

  steps:
    # Pre-flight FinOps: estimate the recurring GPU serving cost before the
    # manifest is rendered, tagged with the `run` stage.
    - id: estimate-cost
      name: 'Estimate the serving cost'
      action: orchestration:estimate-cost
      input:
        goldenPath: llm-serve-deploy
        stage: run
        artifact: ${{ parameters.modelName }}
        params:
          gpuType: ${{ parameters.gpuType }}
          gpuCount: ${{ parameters.gpuCount }}

    # Pre-flight cost guardrail: warn (never block) when the estimate is over
    # budget. Flip mode to `enforce` to block a fail-level overrun.
    - id: cost-gate
      name: 'Check the cost budget'
      action: orchestration:cost-gate
      input:
        # Block a fail-level overrun (the estimate step above only warns).
        mode: enforce
        goldenPath: llm-serve-deploy
        stage: run
        artifact: ${{ parameters.modelName }}
        params:
          gpuType: ${{ parameters.gpuType }}
          gpuCount: ${{ parameters.gpuCount }}

    # Pre-flight security scan: block the run on a policy violation (missing
    # guardrails, no tenant boundary, no audit trail) before anything is
    # rendered or deployed.
    - id: security-scan
      name: 'Scan the security posture'
      action: orchestration:security-scan
      input:
        goldenPath: llm-serve-deploy
        stage: run
        artifact: ${{ parameters.modelName }}
        params:
          inputGuardrails: ${{ parameters.inputGuardrails }}
          outputGuardrails: ${{ parameters.outputGuardrails }}
          injectionDetection: ${{ parameters.injectionDetection }}
          tenantNamespace: ${{ parameters.tenantNamespace }}
          auditLogging: ${{ parameters.auditLogging }}
          contextBoundary: ${{ parameters.contextBoundary }}
          encryptionAtRest: ${{ parameters.encryptionAtRest }}
          explainability: ${{ parameters.explainability }}

    - id: prepare-manifest
      name: 'Render the InferenceService manifest / deploy'
      action: orchestration:prepare-llm-deploy-manifest
      input:
        modelName: ${{ parameters.modelName }}
        huggingFaceModelId: ${{ parameters.huggingFaceModelId }}
        hfTokenSecretRef: ${{ parameters.hfTokenSecretRef }}
        runtime: ${{ parameters.runtime }}
        gpuType: ${{ parameters.gpuType }}
        gpuCount: ${{ parameters.gpuCount }}
        quantization: ${{ parameters.quantization }}
        maxContextLength: ${{ parameters.maxContextLength }}
        trafficStrategy: ${{ parameters.deployStrategy }}
        trafficPercent: ${{ parameters.trafficPercent }}
        releaseStrategy: ${{ parameters.releaseStrategy }}
        environment: ${{ parameters.environment }}
        batchingStrategy: ${{ parameters.batchingStrategy }}
        enablePagedAttention: ${{ parameters.enablePagedAttention }}
        enablePrefixCaching: ${{ parameters.enablePrefixCaching }}
        speculativeDecoding: ${{ parameters.speculativeDecoding }}
        draftModelId: ${{ parameters.draftModelId }}
        pipelineParallelSize: ${{ parameters.pipelineParallelSize }}

    - id: publish-pr
      name: 'Open the deploy PR'
      action: publish:github:pull-request
      if: ${{ parameters.releaseStrategy === 'pr-gated' }}
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: llm-serve-deploy-${{ parameters.modelName }}
        title: 'Serve LLM ${{ parameters.modelName }} (${{ parameters.huggingFaceModelId }})'
        description: >
          Adds the KServe InferenceService manifest for
          **${{ parameters.modelName }}** (${{ parameters.huggingFaceModelId }},
          ${{ parameters.gpuType }} x${{ parameters.gpuCount }},
          quantization=${{ parameters.quantization }},
          batchingStrategy=${{ parameters.batchingStrategy }},
          enablePagedAttention=${{ parameters.enablePagedAttention }},
          enablePrefixCaching=${{ parameters.enablePrefixCaching }},
          pipelineParallelSize=${{ parameters.pipelineParallelSize }}).
          Requires a GPU-enabled cluster with the vLLM ServingRuntime installed
          (infra/llm-serving/README.md) — merging this PR only deploys if
          ArgoCD is watching a cluster that actually has that GPU capacity.
        sourcePath: infra/environments/dev/inference-services/llmops-team
        targetPath: infra/environments/dev/inference-services/llmops-team

  output:
    # Pre-flight FinOps recap — the same estimate/gate the form panel showed,
    # surfaced on the task result. Values are empty when the estimate step was
    # skipped (e.g. a non-deploy action); the card then renders nothing.
    costGoldenPath: llm-serve-deploy
    costStage: run
    costEstimated: ${{ steps['estimate-cost'].output.estimatedCost }}
    costLevel: ${{ steps['cost-gate'].output.level }}
    costBudget: ${{ steps['cost-gate'].output.budget }}
    costReasons: ${{ steps['cost-gate'].output.reasons }}
    costAlternatives: ${{ steps['cost-gate'].output.alternatives }}
    securityScore: ${{ steps['security-scan'].output.score }}
    securityPassed: ${{ steps['security-scan'].output.passed }}
    text:
      - title: Result
        content: |
          Security posture: **${{ steps['security-scan'].output.score }}/100** —
          input/output guardrails, injection detection, tenant isolation and
          the inference audit trail are enforced.

          Rendered the InferenceService manifest for
          **${{ parameters.modelName }}** (${{ parameters.huggingFaceModelId }}),
          batchingStrategy=${{ parameters.batchingStrategy }},
          enablePagedAttention=${{ parameters.enablePagedAttention }},
          enablePrefixCaching=${{ parameters.enablePrefixCaching }},
          pipelineParallelSize=${{ parameters.pipelineParallelSize }}.

          {% if parameters.releaseStrategy === 'pr-gated' %}
          Deploy PR opened: ${{ steps['publish-pr'].output.remoteUrl }}

          It contains `infra/environments/dev/inference-services/llmops-team/${{ parameters.modelName }}/llm.yaml`.
          Promotion to staging/prod is Kargo's job, not this Portal's —
          see infra/kargo/README.md.
          Merging it only deploys on a cluster with GPU capacity and the
          vLLM ServingRuntime installed — see infra/llm-serving/README.md.
          {% else %}
          releaseStrategy=instant called orchestration-api directly — check
          `kubectl get inferenceservice ${{ parameters.modelName }} -o yaml`
          on a GPU-enabled cluster to confirm it actually scheduled.
          {% endif %}
