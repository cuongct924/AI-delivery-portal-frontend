apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: evaluate-deploy-model
  title: 'Evaluate & Deploy Model'
  description: >
    Deploy, roll back, or promote a registered model version.
  tags:
    - mlops
  links:
    - title: Troubleshooting FAQ
      url: /docs/default/system/ai-delivery-portal/troubleshooting-faq

spec:
  owner: user:guest
  type: service

  parameters:
    - title: Model to deploy
      description: >
        Pick an action and a registered model version. Deploy runs the
        Evaluate Gate first; rollback and promote reuse an already-passed
        version.
      required:
        - action
        - modelName
      properties:
        action:
          title: Action
          type: string
          enum: [deploy, rollback, promote, promote-confirm]
          default: deploy
          # Rendered as a row of cards (StepLayoutField's actionPicker),
          # each with its own one-line caption — this text is a fallback
          # for anything reading the raw schema, not what a Dev sees.
          # promote only ever renders a ProjectReleaseBinding manifest and
          # opens a PR — it writes nothing to the cluster.
          # promote-confirm is a *second*, separate run of this same
          # template (after that PR is reviewed and merged) that actually
          # applies it — see adapters/delivery/
          # openchoreo_promotion_adapter.py's module docstring in the
          # backend repo for why staging/prod promotion is PR-gated this
          # way.
          description: What to do.
        modelName:
          title: Model name
          type: string
          default: fraud-detection
          description: Pick a model registered via Train → Track → Register.
        # deploySummary is declared here (not just inside the Summary
        # group's ui:options entry) because renderField/isRenderable both
        # require the named property to exist in `schema.properties` —
        # see StepLayoutField's summaryField flag doc comment. Its own
        # value is never read (not required, never referenced by `steps:`
        # below) — DeploySummaryPanel computes and displays a sentence
        # from the OTHER fields' values instead.
        deploySummary:
          title: Summary
          type: string
          readOnly: true
          description: Computed automatically — nothing to fill in.
        # Pre-flight FinOps panel (StepLayoutField's costEstimate flag) —
        # calls the same /costs/estimate + /costs/check the estimate-cost/
        # cost-gate steps below call at submit time, so the Dev sees the
        # run cost and budget impact before running. Its own value is never
        # read; only its group placement matters.
        costEstimate:
          title: Cost estimate
          type: string
          readOnly: true
          # Carries the golden path name so the Review step can resolve the
          # same estimate config; the panel itself reads its ui:options.
          default: evaluate-deploy-model
          description: Computed automatically — nothing to fill in.
        # Security control surface (StepLayoutField's securityScan flag) —
        # scanned before the deploy/promote runs; a blocking finding stops it.
        approvalGate:
          title: Approval gate
          type: string
          oneOf:
            - const: none
              title: No approval
            - const: auto
              title: Auto-approve on gate pass
            - const: manual
              title: Manual approval required
          default: auto
          description: >
            Required off dev — a non-dev deploy/promote needs an approval
            gate, not just a passing Evaluate Gate.
        provenanceTracking:
          title: Provenance tracking
          type: boolean
          default: true
          description: Record dataset version + code commit with the version.
        auditLogging:
          title: Inference audit trail
          type: boolean
          default: true
          description: Record every deploy/promote with actor and artifact.
        explainability:
          title: Explainability
          type: boolean
          default: false
          description: Attach the gate's reasoning to the audited decision.
        # Pre-flight security panel — calls the same /security/scan the
        # security-scan step below calls at submit time.
        securityScan:
          title: Security posture
          type: string
          readOnly: true
          default: evaluate-deploy-model
          description: Computed automatically — nothing to fill in.
        # modelVersion/enablePredictionLogging/deployStrategy/
        # releaseStrategy/trafficPercent/repoUrl/targetEnvironment are all
        # declared conditionally in the allOf below, gated on `action` —
        # same "only exists where it applies" mechanism as
        # train-track-register's finetuneEnabled/baseModelUri. Whichever
        # of these don't apply to the chosen action don't exist in the
        # resolved schema at all, so StepLayoutField renders none of
        # them — the form really shrinks per action, not merely
        # hide-but-still-submit fields the backend then ignores.
      allOf:
        - if:
            required: [action]
            properties:
              action:
                enum: [deploy, rollback]
          then:
            required:
              - modelVersion
            properties:
              modelVersion:
                title: Version
                type: string
                default: '1'
                description: >
                  Registered versions for this model. For rollback, the
                  version to roll back *to*.
              # Only meaningful for deploy/rollback — promote never calls
              # prepare-deploy-manifest, so there's no tag call for this
              # to control.
              enablePredictionLogging:
                title: Log predictions for drift monitoring
                type: boolean
                default: true
                description: >
                  Tags this version for future drift monitoring. Log calls
                  yourself via POST /models/{name}/predictions/log.
        - if:
            required: [action]
            properties:
              action:
                const: promote
          then:
            required:
              - targetEnvironment
              - repoUrl
            properties:
              targetEnvironment:
                title: Promote to
                type: string
                enum: [staging, production]
                default: staging
                description: >
                  staging ← development, production ← staging. Fails
                  clearly if the source has nothing bound yet. Renders the
                  ProjectReleaseBinding manifest and opens a PR — nothing
                  is applied to the cluster until you run this template
                  again with **promote-confirm** after merging it.
              # Declared here too, not just under deploy/pr-gated below:
              # this branch requires repoUrl (the PR needs a target repo)
              # but RJSF can't fill a required property that doesn't exist
              # in the resolved schema — without this, Review always fails
              # with "'Repo Url' must have required property 'repoUrl'".
              # Renders inside the Release group (releaseStrategy itself
              # stays deploy-only and is skipped here).
              repoUrl:
                title: Repository
                type: string
                default: github.com?owner=cuongct924&repo=backstage-plugins
                description: 'PR target repo: github.com?owner=<org>&repo=<repo>.'
        - if:
            required: [action]
            properties:
              action:
                const: promote-confirm
          then:
            required:
              - confirmEnvironment
              - confirmProjectRelease
            properties:
              confirmEnvironment:
                title: Environment to apply
                type: string
                enum: [staging, production]
                default: staging
                description: >
                  The environment named in the PR you just merged.
              confirmProjectRelease:
                title: Project release
                type: string
                default: fraud-detection-development
                description: >
                  The `projectRelease` value shown when you ran promote
                  (also visible in the merged PR's
                  projectreleasebinding-<environment>.yaml file).
        - if:
            required: [action]
            properties:
              action:
                const: deploy
          then:
            required:
              - deployStrategy
              - releaseStrategy
            properties:
              deployStrategy:
                title: Deploy strategy
                type: string
                enum: [direct, canary, ab, blue-green]
                default: direct
                description: >
                  Direct = full cutover now, always valid.
                  Canary/A-B/Blue-Green need a prior deploy of this model.
              releaseStrategy:
                title: Release strategy
                type: string
                enum: [pr-gated, instant]
                default: instant
                description: >
                  Instant deploys now, no PR. PR-gated opens a PR for
                  review; merging it deploys automatically (a local
                  watcher applies it — see
                  scripts/watch-and-apply-workload.sh in the backend repo).
            allOf:
              - if:
                  required: [deployStrategy]
                  properties:
                    deployStrategy:
                      const: blue-green
                then:
                  required:
                    - trafficPercent
                  properties:
                    trafficPercent:
                      title: Traffic percent
                      type: integer
                      enum: [0, 100]
                      default: 100
                      description: 0 = staged dark, 100 = cutover now.
              - if:
                  required: [deployStrategy]
                  properties:
                    deployStrategy:
                      enum: [canary, ab]
                then:
                  required:
                    - trafficPercent
                  properties:
                    trafficPercent:
                      title: Traffic percent
                      type: integer
                      enum: [5, 10, 25, 50, 75, 90]
                      default: 10
                      description: >
                        Canary: start low, raise later. A-B: fixed split
                        for comparison. See "Version comparison" below.
              - if:
                  required: [releaseStrategy]
                  properties:
                    releaseStrategy:
                      const: pr-gated
                then:
                  required:
                    - repoUrl
                  properties:
                    repoUrl:
                      title: Repository
                      type: string
                      default: github.com?owner=cuongct924&repo=backstage-plugins
                      description: 'PR target repo: github.com?owner=<org>&repo=<repo>.'
      ui:field: StepLayout
      ui:options:
        groups:
          - title: Action
            icon: bolt
            fields:
              - name: action
                actionPicker: true
          - title: Model
            icon: apps
            fields:
              - name: modelName
                width: 6
                modelNamePicker: true
              - name: modelVersion
                width: 6
                modelVersionPicker: true
                modelVersionCheck: true
          - title: Deploy strategy
            icon: tune
            fields:
              - deployStrategy
              - name: trafficPercent
                versionComparison: true
          - title: Security
            icon: security
            fields:
              - name: approvalGate
                width: 6
              - name: provenanceTracking
                width: 6
              - name: auditLogging
                width: 6
              - name: explainability
                width: 6
              - name: securityScan
                securityScan:
                  goldenPath: evaluate-deploy-model
                  stage: run
                  artifactFields: [modelName]
                  paramFields:
                    [
                      approvalGate,
                      provenanceTracking,
                      auditLogging,
                      explainability,
                      targetEnvironment,
                    ]
          - title: Cost estimate
            icon: attach_money
            fields:
              - name: costEstimate
                costEstimate:
                  goldenPath: evaluate-deploy-model
                  stage: run
                  artifactFields: [modelName]
                  paramFields: [deployStrategy, trafficPercent]
                  when:
                    action: deploy
          - title: Release
            icon: launch
            fields:
              - releaseStrategy
              - repoUrl
          - title: Promotion
            icon: trending_up
            fields:
              - name: targetEnvironment
                promotionPreview: true
              - confirmEnvironment
              - confirmProjectRelease
          - title: Monitoring
            icon: query_stats
            fields:
              - enablePredictionLogging
          - title: Summary
            icon: assignment
            fields:
              - name: deploySummary
                summaryField: true

  steps:
    - id: policy-check
      name: 'Run the Evaluate Gate'
      action: orchestration:policy-check
      # Only a plain deploy re-runs the gate. Rollback is a production
      # emergency rolling back to a version that already passed it once —
      # re-gating here would defeat the entire point of rollback being
      # fast, and could even block the rollback outright if thresholds
      # changed since. Promote doesn't take a modelVersion at all — it
      # moves whatever's already bound in the source environment (already
      # gated when IT was deployed) forward, nothing new to gate here.
      if: ${{ parameters.action === 'deploy' }}
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ parameters.modelVersion }}

    # Pre-flight FinOps: estimate the recurring run cost before anything is
    # provisioned, attributed to the model and tagged with the `run` stage.
    # Surfaced in the output below; a later Cost Insights view reads the same
    # attribution. Only a plain deploy has a run cost to estimate.
    - id: estimate-cost
      name: 'Estimate the run cost'
      action: orchestration:estimate-cost
      if: ${{ parameters.action === 'deploy' }}
      input:
        goldenPath: evaluate-deploy-model
        stage: run
        artifact: ${{ parameters.modelName }}
        params:
          deployStrategy: ${{ parameters.deployStrategy }}
          trafficPercent: ${{ parameters.trafficPercent }}

    # Pre-flight cost guardrail: warn (never block) when the estimate is over
    # budget. Flip mode to `enforce` to block a fail-level overrun.
    - id: cost-gate
      name: 'Check the cost budget'
      action: orchestration:cost-gate
      if: ${{ parameters.action === 'deploy' }}
      input:
        # Block a fail-level overrun (the estimate step above only warns).
        mode: enforce
        goldenPath: evaluate-deploy-model
        stage: run
        artifact: ${{ parameters.modelName }}
        params:
          deployStrategy: ${{ parameters.deployStrategy }}
          trafficPercent: ${{ parameters.trafficPercent }}

    # Pre-flight security scan: a non-dev promote without an approval gate is
    # blocked before the manifest is rendered.
    - id: security-scan
      name: 'Scan the security posture'
      action: orchestration:security-scan
      if: ${{ parameters.action === 'deploy' or parameters.action === 'promote' }}
      input:
        goldenPath: evaluate-deploy-model
        stage: run
        artifact: ${{ parameters.modelName }}
        params:
          approvalGate: ${{ parameters.approvalGate }}
          provenanceTracking: ${{ parameters.provenanceTracking }}
          auditLogging: ${{ parameters.auditLogging }}
          explainability: ${{ parameters.explainability }}
          environment: ${{ parameters.targetEnvironment }}

    - id: prepare-manifest
      name: 'Render the InferenceService manifest / deploy'
      action: orchestration:prepare-deploy-manifest
      if: ${{ parameters.action === 'deploy' or parameters.action === 'rollback' }}
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ parameters.modelVersion }}
        action: ${{ parameters.action }}
        # deployStrategy/releaseStrategy/trafficPercent don't exist as
        # parameters at all for a rollback (see the allOf gate above) —
        # sending `undefined` here is fine either way: the backend
        # ignores all 3 and forces blue-green/100%/instant itself when
        # action=rollback, exactly so this template never has to get that
        # combination right.
        trafficStrategy: ${{ parameters.deployStrategy }}
        trafficPercent: ${{ parameters.trafficPercent }}
        releaseStrategy: ${{ parameters.releaseStrategy }}
        enablePredictionLogging: ${{ parameters.enablePredictionLogging }}

    - id: publish-pr
      name: 'Open the deploy PR'
      action: publish:github:pull-request
      # Only a plain deploy can open a PR — rollback is always instant,
      # promote never renders a manifest at all.
      if: ${{ parameters.action === 'deploy' and parameters.releaseStrategy === 'pr-gated' }}
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: deploy-${{ parameters.modelName }}-${{ parameters.modelVersion }}
        title: 'Deploy ${{ parameters.modelName }}:${{ parameters.modelVersion }}'
        description: >
          Deploy manifest for **${{ parameters.modelName }}** version
          **${{ parameters.modelVersion }}** (Evaluate Gate passed,
          deployStrategy=${{ parameters.deployStrategy }}). Merging this
          is the review record — nothing in this repo watches `main` and
          applies it automatically yet, so `kubectl apply` the merged file
          by hand once it's reviewed.
        # A wider source/targetPath than any one manifest's actual file —
        # orchestration:prepare-deploy-manifest picks the real path
        # server-side (infra/openchoreo/telco-fraud-detection/
        # workload-serving.yaml today; infra/environments/dev/
        # inference-services/... for the legacy, non-OpenChoreo backend)
        # and writes exactly one file there, nothing else — this template
        # can't know which without duplicating that backend-mode decision
        # here, so it just carries forward whatever landed under infra/.
        sourcePath: infra
        targetPath: infra

    - id: record-deploy
      name: 'Record the deploy'
      action: orchestration:record-deploy
      if: ${{ parameters.action === 'deploy' or parameters.action === 'rollback' }}
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ parameters.modelVersion }}
        prUrl: ${{ parameters.action === 'deploy' and parameters.releaseStrategy === 'pr-gated' and steps['publish-pr'].output.remoteUrl or '' }}

    - id: promote
      name: 'Render the promotion manifest'
      action: orchestration:promote-model
      # Renders the ProjectReleaseBinding manifest only — writes nothing.
      if: ${{ parameters.action === 'promote' }}
      input:
        modelName: ${{ parameters.modelName }}
        targetEnvironment: ${{ parameters.targetEnvironment }}

    - id: publish-promote-pr
      name: 'Open the promotion PR'
      action: publish:github:pull-request
      if: ${{ parameters.action === 'promote' }}
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: promote-${{ parameters.modelName }}-${{ parameters.targetEnvironment }}
        title: 'Promote ${{ parameters.modelName }} to ${{ parameters.targetEnvironment }}'
        description: >
          Promotes **${{ parameters.modelName }}** to
          **${{ parameters.targetEnvironment }}**
          (projectRelease=${{ steps['promote'].output.projectRelease }}).
          Review and merge this before running **promote-confirm** — that
          separate, later run is what actually applies it; merging this PR
          alone changes nothing in the cluster.
        sourcePath: infra
        targetPath: infra

    - id: confirm-promote
      name: 'Apply the merged promotion'
      action: orchestration:confirm-promotion
      # The only real path that reaches
      # OpenChoreoPromotionAdapter.confirm_promotion() — running this
      # template yourself, as a separate step after reviewing/merging the
      # PR promote opened, *is* the manual-approval gate.
      # See that adapter's module docstring.
      if: ${{ parameters.action === 'promote-confirm' }}
      input:
        modelName: ${{ parameters.modelName }}
        environment: ${{ parameters.confirmEnvironment }}
        projectRelease: ${{ parameters.confirmProjectRelease }}
        eventType: deploy

  output:
    # Pre-flight FinOps recap — the same estimate/gate the form panel showed,
    # surfaced on the task result. Values are empty when the estimate step was
    # skipped (e.g. a non-deploy action); the card then renders nothing.
    costGoldenPath: evaluate-deploy-model
    costStage: run
    costEstimated: ${{ steps['estimate-cost'].output.estimatedCost }}
    costLevel: ${{ steps['cost-gate'].output.level }}
    costBudget: ${{ steps['cost-gate'].output.budget }}
    costReasons: ${{ steps['cost-gate'].output.reasons }}
    costAlternatives: ${{ steps['cost-gate'].output.alternatives }}
    securityScore: ${{ steps['security-scan'].output.score }}
    securityPassed: ${{ steps['security-scan'].output.passed }}
    links:
      - title: View this model in MLflow
        url: http://localhost:5000/#/models/${{ parameters.modelName }}
      - title: 'Next: Set Up Monitoring for this version'
        url: /create/templates/default/setup-model-monitoring
    text:
      - title: Result
        content: |
          {% if parameters.action === 'rollback' %}
          Rolled back **${{ parameters.modelName }}** to version
          **${{ parameters.modelVersion }}** — instant, 100% cutover, no PR.
          Check status with
          `kubectl get inferenceservice ${{ parameters.modelName }} -o yaml`.
          {% elif parameters.action === 'promote' %}
          Promotion PR opened: ${{ steps['publish-promote-pr'].output.remoteUrl }}

          **Nothing has been applied to the cluster yet.** Review and
          merge that PR, then run this template again with
          **promote-confirm**, environment=**${{ parameters.targetEnvironment }}**,
          and projectRelease=**${{ steps['promote'].output.projectRelease }}**
          to actually promote it.
          {% elif parameters.action === 'promote-confirm' %}
          Applied — **${{ parameters.modelName }}** is now bound to
          **${{ parameters.confirmProjectRelease }}** in
          **${{ parameters.confirmEnvironment }}**.

          Release bound per environment:
          `${{ steps['confirm-promote'].output.environmentsSummary }}`

          {% if steps['confirm-promote'].output.prodPendingApproval %}
          Staging is now ahead of production — run this template again
          with **promote** and **production** selected when you're ready
          to promote it the rest of the way.
          {% endif %}
          {% else %}
          Evaluate Gate passed for **${{ parameters.modelName }}** version
          **${{ parameters.modelVersion }}**
          (deployStrategy=${{ parameters.deployStrategy }}, releaseStrategy=${{ parameters.releaseStrategy }}).

          Estimated run cost: **${{ steps['estimate-cost'].output.estimatedCost }} USD**.

          Security posture: **${{ steps['security-scan'].output.score }}/100** —
          approval gate, provenance tracking and the audit trail are enforced.

          {% if parameters.releaseStrategy === 'pr-gated' %}
          Deploy PR opened: ${{ steps['publish-pr'].output.remoteUrl }}

          Review and merge it, then `kubectl apply` the merged file by
          hand — there's no watcher applying it automatically yet. Once
          it's live in development, run this template again with
          **promote** to move it to staging/production.
          {% else %}
          Deployed immediately — no PR opened. Check status with
          `kubectl get inferenceservice ${{ parameters.modelName }} -o yaml`.
          {% endif %}

          {% if parameters.enablePredictionLogging %}
          **Next step:** open **Set Up Model Monitoring** (link above) with
          modelName=`${{ parameters.modelName }}` and
          modelVersion=`${{ parameters.modelVersion }}`.

          Prediction logging is enabled for this version —
          have whatever calls the deployed endpoint also call
          `POST /models/${{ parameters.modelName }}/predictions/log` with
          the same version. "Set Up Model Monitoring" already exists as a
          Golden Path for drift checks, but it currently takes a static
          `productionDataUri` CSV, not these logged predictions yet —
          export enough of them from `GET /models/${{ parameters.modelName }}/predictions`
          once you have a batch worth comparing, then run that template
          against the export.
          {% endif %}
          {% endif %}
