apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: train-track-register
  title: "Train & Register Model"
  description: >
    Trains or fine-tunes a model, tracks the run in MLflow, and registers
    the resulting version with a Catalog entry.
  tags:
    - mlops

spec:
  owner: user:guest
  type: service


  parameters:
    - title: General Information
      required:
        - owner
        - modelName
        - repoUrl
        - businessDomain
        - useCase
      properties:
        owner:
          title: Owning team
          type: string
          default: mlops-team
          description: Catalog owner for the registered model.
          # Dropdown listing live Catalog Group entities. Renders as a
          # plain select (see OwnerTeamPicker) so clicking the field always
          # reopens the full list, instead of OwnerPicker's Autocomplete
          # which narrows the list to whatever text is already typed.
          ui:field: OwnerTeamPicker
        modelName:
          title: Model name
          type: string
          description: E.g. "fraud-detection"
          default: fraud-detection-demo
        businessDomain:
          title: Business domain
          type: string
          # Only domains with a real, working use case below (mock data +
          # backend support) — one gets added here only once its useCase
          # branch in the allOf below has somewhere real to point to.
          oneOf:
            - const: network-infrastructure
              title: Network & Infrastructure
            - const: fraud-risk
              title: Fraud & Risk
            - const: marketing-sales
              title: Marketing & Sales
            - const: finance-operations
              title: Finance & Operations
            - const: real-estate-construction
              title: Real Estate & Construction
          default: fraud-risk
          description: >
            Business context for this model — tags the Catalog entry for
            search/filtering only, doesn't affect training config below.
        useCase:
          title: Use case
          type: string
          description: Specific problem this model solves — Catalog metadata only.
        repoUrl:
          title: Repository
          type: string
          description: Target repo for the Catalog entry PR.
          default: github.com?owner=cuongct924&repo=backstage-plugins
      # useCase's options are narrowed per businessDomain — each domain
      # above maps to exactly one real, working use case for now, so
      # picking a domain always fully determines useCase's (single-item)
      # list; StepLayoutField's own stale-value cleanup clears the old
      # value automatically when the domain changes (same mechanism as
      # algorithm clearing when algorithmFamily/taskType change). Flat
      # `enum`, not `oneOf`-of-const — see algorithmFamily's narrowing
      # branch in Architecture & Task for why oneOf breaks here.
      allOf:
        - if:
            properties:
              businessDomain:
                const: network-infrastructure
          then:
            properties:
              useCase:
                enum: [network-anomaly-detection]
        - if:
            properties:
              businessDomain:
                const: fraud-risk
          then:
            properties:
              useCase:
                enum: [telco-fraud-detection]
        - if:
            properties:
              businessDomain:
                const: marketing-sales
          then:
            properties:
              useCase:
                enum: [customer-segmentation]
        - if:
            properties:
              businessDomain:
                const: finance-operations
          then:
            properties:
              useCase:
                enum: [revenue-forecast]
        - if:
            properties:
              businessDomain:
                const: real-estate-construction
          then:
            properties:
              useCase:
                enum: [house-price-prediction]
      # StepLayout is a custom Scaffolder field extension (see
      # packages/app-backstage/src/modules/scaffolder/) registered via
      # FormFieldBlueprint — renders this step's own unchanged properties
      # inside titled Card/Accordion groups with a responsive grid, instead
      # of RJSF's default one-field-per-full-width-row layout. Field names
      # below still resolve as plain ${{ parameters.X }} — this only
      # changes how the step looks.
      ui:field: StepLayout
      ui:options:
        groups:
          - title: General Information
            fields:
              - name: owner
                width: 6
              - name: modelName
                width: 6
              - name: businessDomain
                width: 6
              - name: useCase
                width: 6
              - repoUrl

    # Branches on `architecture` (and, for the sklearn branch, `algorithm`).
    # Each architecture's fields only appear once that architecture is
    # selected — picking "sklearn" never shows lstm/nlp/cv fields and
    # vice versa.
    #
    # Comes BEFORE the Dataset & Task step on purpose: `architecture`
    # decides what a valid dataset looks like (cv needs a .zip of images,
    # everything else a CSV — train.py's `pd.read_csv(...)` runs for
    # everything except cv), so Dataset & Task needs this step's value
    # already in formData to scope its own fields. targetColumn/
    # timeColumn/textColumn/idColumns live there too, for the same reason
    # (need a real dataset picked first for columnPicker to offer real
    # names) — the lstm/nlp branches below only keep their non-column
    # hyperparameters, so this move didn't touch this step's other branches.
    - title: Architecture & Task
      required:
        - modelCategory
        - architecture
        - taskType
      properties:
        modelCategory:
          title: Model category
          type: string
          oneOf:
            - const: traditional-ml
              title: Traditional ML
            - const: deep-learning
              title: Deep Learning
          default: traditional-ml
          # Traditional ML = scikit-learn (plus XGBoost/LightGBM/CatBoost
          # via Library below). Deep Learning = PyTorch (mlp/lstm)
          # or fine-tuning a Transformer/CNN. Pick this first — the choices
          # below only show for this category.
          description: Pick first — narrows the choices below to this category.
        architecture:
          type: string
        taskType:
          title: Task type
          type: string
          enum: [classification, regression, clustering, anomaly-detection]
          default: classification
          # Also decides which data columns need picking in the next
          # Dataset step (e.g. Target column). This base enum/default only
          # matters transiently — every businessDomain option below forces
          # taskType to its own const, so this is really just the fallback
          # shape before that resolves.
          description: Set automatically from the use case chosen in General Information.
        # finetuneEnabled/baseModelUri are declared conditionally in the
        # allOf below, not here — only combos that support mode=finetune
        # get them, and StepLayoutField's own stale-value cleanup then
        # hides the toggle panel for free when a user switches away.
      ui:field: StepLayout
      ui:options:
        groups:
          # No longer "& Task" — taskType is const-forced by businessDomain
          # (see the allOf below) and never renders here anymore.
          - title: Model Category
            icon: apps
            fields:
              - name: modelCategory
                width: 6
              # Whichever of these 2 exists for the current modelCategory
              # (algorithmFamily for traditional-ml, architecture for
              # deep-learning — see the allOf below) fills the other half;
              # the absent one is silently skipped, never an empty slot.
              - name: algorithmFamily
                width: 6
              - name: architecture
                width: 6
              # Shown disabled with its forced value (see the
              # businessDomain-keyed const branches below) instead of the
              # default silent skip for const fields — this one should
              # read as "set for you", not as having disappeared.
              - name: taskType
                width: 6
                lockedDisplay: true
          # variant=optional -> light-gray surface, signaling "off by
          # default" the same way everywhere a toggleField is used.
          - title: Continue training from an existing model
            icon: tune
            variant: optional
            toggleField: finetuneEnabled
            fields:
              - name: baseModelUri
                baseModelPicker: true
          - title: Algorithm
            icon: function
            fields:
              - algorithm
              # Dashed subpanel, not a sibling panel — BYOC is a CHILD of
              # "Algorithm = Custom", not an independent decision. Skipped
              # entirely (no empty dashed box) unless that branch is active.
              - subpanel:
                  title: Custom code (BYOC)
                  fields:
                    - name: codeRepoUrl
                      width: 6
                    - name: entrypointPath
                      width: 6
                    - customConfig
          # One panel shared by all 4 deep-learning architectures instead
          # of leaving them ungrouped — each field only exists in the
          # branch-resolved schema for its own architecture (StepLayout
          # already skips any field missing from `schema.properties`), so
          # per architecture this panel only ever shows the rows that
          # apply to it, and disappears entirely for combinations with
          # nothing to show (e.g. traditional-ml, which has none of these).
          - title: Training parameters
            icon: tune
            fields:
              - name: hiddenLayers
                width: 12
              - name: sequenceLength
                width: 4
              - name: numLayers
                width: 4
              - name: hiddenSize
                width: 4
              - name: baseModelName
                width: 6
              - name: dropout
                width: 6
              - name: learningRate
                width: 6
              - name: epochs
                width: 6
              - name: batchSize
                width: 6
              - name: optimizer
                width: 6
      allOf:
        - if:
            properties:
              finetuneEnabled:
                const: true
          then:
            required:
              - baseModelUri
        # --- "Continue training" (warm_start / mode=finetune) only exists
        # for combos train.py actually supports: architecture=sklearn (via
        # warm_start=True) and mlp/lstm (via mlflow_pytorch.load_model).
        # NOT nlp/cv (train.py raises — both already fine-tune from their
        # own pretrained weights, an unrelated mechanism), algorithm=custom
        # (BYOC has no base model to resume), or taskType=clustering
        # (nothing persists to continue from).
        - if:
            not:
              anyOf:
                - required:
                    - architecture
                  properties:
                    architecture:
                      enum: [nlp, cv]
                - required:
                    - algorithm
                  properties:
                    algorithm:
                      const: custom
                - required:
                    - taskType
                  properties:
                    taskType:
                      enum: [clustering, anomaly-detection]
          then:
            properties:
              finetuneEnabled:
                title: Continue training from an existing model
                type: boolean
                default: false
                description: >
                  Leave off to train from scratch. If enabled, pick a
                  registered model below to continue training from
                  (warm-start) instead.
              baseModelUri:
                title: Base model
                type: string
                description: >
                  Reuses that model's own algorithm — your Algorithm
                  choice above (if any) is ignored while this is on.
        # --- businessDomain (picked in General Information) fully
        # determines taskType — each of the 5 domains there maps to
        # exactly one working use case (see data/<taskType>-<useCase>/),
        # so there's nothing left to choose here; forced via `const`,
        # same mechanism as architecture: {const: sklearn} below. Once a
        # domain is picked, Task type disappears instead of offering a
        # choice that could contradict it (StepLayoutField's stale-value
        # effect writes the const every render; renderField skips
        # rendering any field that resolves to one).
        - if:
            properties:
              businessDomain:
                const: fraud-risk
          then:
            properties:
              taskType:
                const: classification
        - if:
            properties:
              businessDomain:
                const: real-estate-construction
          then:
            properties:
              taskType:
                const: regression
        - if:
            properties:
              businessDomain:
                const: marketing-sales
          then:
            properties:
              taskType:
                const: clustering
        - if:
            properties:
              businessDomain:
                const: network-infrastructure
          then:
            properties:
              taskType:
                const: anomaly-detection
        - if:
            properties:
              businessDomain:
                const: finance-operations
          then:
            properties:
              taskType:
                const: regression
                # Shown as "Time-series forecasting" (displayTitle, see
                # StepLayoutField's lockedDisplay rendering) — still
                # literally trains as regression underneath (same
                # algorithm_registry.py/metrics.py/gate.py as any other
                # regression run, see the time-series-forecasting-
                # revenue-forecast/ folder note in data/README.md); the
                # only real difference is Time column below, which
                # switches _split() to a chronological TimeSeriesSplit
                # instead of a random holdout.
                displayTitle: Time-series forecasting
                description: >
                  Forecasts over time — same regression algorithms
                  underneath, set Time column below to split
                  chronologically instead of randomly.
        # --- modelCategory narrows which architectures are selectable —
        # must come before the architecture-keyed branches below so the
        # dropdown is already filtered by the time the user reaches them.
        - if:
            properties:
              modelCategory:
                const: traditional-ml
          then:
            required:
              - algorithmFamily
            properties:
              # Fixed — every traditional-ML library dispatches through
              # the same backend architecture branch (see the field's own
              # description above); the actual library choice lives in
              # algorithmFamily instead, so nothing interactive to pick.
              architecture:
                const: sklearn
              algorithmFamily:
                title: Library
                type: string
                oneOf:
                  - const: scikit-learn
                    title: scikit-learn
                  - const: xgboost
                    title: XGBoost
                  - const: lightgbm
                    title: LightGBM
                  - const: catboost
                    title: CatBoost
                default: scikit-learn
                # All 4 run through the same "sklearn" backend (shared
                # .fit()/.predict() API), differing only in the specific
                # library, not the network architecture.
                description: Narrows the Algorithm list below.
        # XGBoost/LightGBM/CatBoost have no clustering or anomaly-detection
        # algorithms in algorithm_registry.py — narrow to the only family
        # that does before the user can even pick one of the other three.
        # Flat `enum`, not `oneOf`-of-const: RJSF concatenates `oneOf`
        # arrays from multiple matching allOf branches instead of
        # replacing them, so algorithmFamily's base 4-entry oneOf (scikit-
        # learn/xgboost/lightgbm/catboost) plus this branch's own oneOf
        # produced 2 duplicate "scikit-learn" entries and RJSF rejected
        # the value as ambiguous — verified empirically (Error: "should
        # not match multiple schemas in oneOf"). `enum` doesn't hit this;
        # same reasoning as useCase/objectiveMetric elsewhere in this file.
        - if:
            properties:
              modelCategory:
                const: traditional-ml
              taskType:
                enum: [clustering, anomaly-detection]
          then:
            properties:
              algorithmFamily:
                enum: [scikit-learn]
        - if:
            properties:
              modelCategory:
                const: deep-learning
          then:
            properties:
              # Real network architecture — the wire value is the bare
              # string (mlp/lstm/nlp/cv) the backend needs, but each option
              # gets an accurate title instead of showing that string raw.
              architecture:
                oneOf:
                  - const: mlp
                    title: "MLP (Multi-Layer Perceptron)"
                  - const: lstm
                    title: "LSTM (recurrent network — sequential/time-series data)"
                  - const: nlp
                    title: "Transformer fine-tune (NLP — text classification)"
                  - const: cv
                    title: "CNN fine-tune (ResNet18 — images)"

        # --- traditional-ml: pick an algorithm within the chosen library ---
        - if:
            properties:
              modelCategory:
                const: traditional-ml
          then:
            required:
              - algorithm
            properties:
              algorithm:
                title: Algorithm
                type: string
                description: >
                  Options depend on the library above and the use case
                  chosen in General Information. Choose "Custom (BYOC)" —
                  Dev-supplied training code instead of a registry
                  algorithm; 3 more fields appear below when chosen.
                default: LogisticRegression
        # Every algorithmFamily-keyed branch below is anchored to BOTH
        # `required: [algorithmFamily]` AND an explicit
        # `modelCategory: {const: traditional-ml}` check. `required` alone
        # only stops the vacuous-truth case (algorithmFamily absent); it
        # does NOT stop a genuinely-still-present STALE value (e.g.
        # algorithmFamily="scikit-learn" left over in formData right after
        # switching to Deep Learning, before StepLayoutField's own
        # disappeared-field cleanup has had a render to catch up) from
        # legitimately re-matching. Anchoring to modelCategory closes that
        # gap immediately — modelCategory itself is a real, always
        # up-to-date field with no staleness window of its own, so this
        # can never vacuously OR stale-ly fire once modelCategory is
        # genuinely "deep-learning". This is what was letting a Deep
        # Learning selection still show Traditional ML's sklearn Algorithm
        # dropdown underneath it.
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: scikit-learn
              taskType:
                const: classification
          then:
            properties:
              algorithm:
                enum: [LogisticRegression, RandomForestClassifier, GradientBoostingClassifier, KNeighborsClassifier, SVC, GaussianNB, custom]
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: scikit-learn
              taskType:
                const: regression
          then:
            properties:
              algorithm:
                enum: [LinearRegression, Ridge, Lasso, RandomForestRegressor, GradientBoostingRegressor, SVR, custom]
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: scikit-learn
              taskType:
                const: clustering
          then:
            properties:
              algorithm:
                enum: [KMeans, DBSCAN, AgglomerativeClustering, GaussianMixture, custom]
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: scikit-learn
              taskType:
                const: anomaly-detection
          then:
            properties:
              algorithm:
                enum: [IsolationForest, LocalOutlierFactor, custom]
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: xgboost
              taskType:
                const: classification
          then:
            properties:
              algorithm:
                enum: [XGBClassifier, custom]
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: xgboost
              taskType:
                const: regression
          then:
            properties:
              algorithm:
                enum: [XGBRegressor, custom]
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: lightgbm
              taskType:
                const: classification
          then:
            properties:
              algorithm:
                enum: [LGBMClassifier, custom]
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: lightgbm
              taskType:
                const: regression
          then:
            properties:
              algorithm:
                enum: [LGBMRegressor, custom]
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: catboost
              taskType:
                const: classification
          then:
            properties:
              algorithm:
                enum: [CatBoostClassifier, custom]
        - if:
            required:
              - algorithmFamily
            properties:
              modelCategory:
                const: traditional-ml
              algorithmFamily:
                const: catboost
              taskType:
                const: regression
          then:
            properties:
              algorithm:
                enum: [CatBoostRegressor, custom]
        # required: [algorithm] closes the same vacuous-truth gap as above
        # — without it, algorithm being absent right after switching to
        # Deep Learning would vacuously match `algorithm: {const: custom}`
        # and show the BYOC fields under Deep Learning too.
        - if:
            required:
              - algorithm
            properties:
              modelCategory:
                const: traditional-ml
              algorithm:
                const: custom
          then:
            required:
              - codeRepoUrl
              - entrypointPath
            properties:
              codeRepoUrl:
                title: Code repository
                type: string
                description: Git repo URL containing your training script.
              entrypointPath:
                title: Entrypoint path
                type: string
                description: >
                  Path, relative to the repo root, to the file defining
                  `def train(dataset: pd.DataFrame, config: dict) -> tuple[Any, dict[str, float]]`.
              customConfig:
                title: Config JSON
                type: string
                description: >
                  JSON object of hyperparameters passed as `config` to your
                  train() function, e.g. {"lr": 0.01}.
                default: "{}"

        # Every architecture-keyed branch below (mlp/lstm/nlp/cv) adds
        # `required: [architecture]` to its own `if` for the same reason
        # as algorithmFamily above — right after switching modelCategory
        # to Deep Learning but before picking a specific architecture,
        # `architecture` is genuinely absent, and without `required` every
        # one of these `if`s would vacuously match at once (showing MLP +
        # LSTM + NLP's fields together) instead of none of them until a
        # choice is made.
        # --- mlp ---
        - if:
            required:
              - architecture
            properties:
              architecture:
                const: mlp
          then:
            required:
              - hiddenLayers
              - dropout
              - learningRate
              - epochs
              - batchSize
            properties:
              hiddenLayers:
                title: Hidden layer sizes
                type: array
                items:
                  type: integer
                  # RJSF's default per-item label ("hiddenLayers-0") has
                  # nothing meaningful to say for a bare integer in a list —
                  # left on, it renders on top of the input's own value,
                  # producing the overlapping-text glitch seen in the mockup
                  # review. The array's own title + description already say
                  # what each entry means, so suppress the redundant label.
                  ui:options:
                    label: false
                description: E.g. [64, 32] — one Linear+ReLU+Dropout block per entry.
              dropout:
                title: Dropout
                type: number
              learningRate:
                title: Learning rate
                type: number
              epochs:
                title: Epochs
                type: integer
              batchSize:
                title: Batch size
                type: integer
              optimizer:
                title: Optimizer
                type: string
                enum: [adam, sgd]
                default: adam
                description: >
                  How the network is fitted. "adam" (default) needs less
                  manual tuning for most non-convex problems; "sgd" is the
                  classic alternative.

        # --- lstm --- (timeColumn itself lives in the Dataset & Task step
        # further down — it needs a real dataset already picked to offer
        # real column names; only the non-column hyperparameters stay here)
        - if:
            required:
              - architecture
            properties:
              architecture:
                const: lstm
          then:
            required:
              - sequenceLength
              - numLayers
              - hiddenSize
              - learningRate
              - epochs
              - batchSize
            properties:
              sequenceLength:
                title: Sequence length
                type: integer
                description: Number of past rows in each sliding-window input.
              numLayers:
                title: LSTM layers
                type: integer
              hiddenSize:
                title: Hidden size
                type: integer
              learningRate:
                title: Learning rate
                type: number
              epochs:
                title: Epochs
                type: integer
              batchSize:
                title: Batch size
                type: integer
              optimizer:
                title: Optimizer
                type: string
                enum: [adam, sgd]
                default: adam

        # --- nlp --- (textColumn lives in the Dataset & Task step, same
        # reason as lstm's timeColumn above)
        - if:
            required:
              - architecture
            properties:
              architecture:
                const: nlp
          then:
            required:
              - baseModelName
              - learningRate
              - epochs
              - batchSize
            properties:
              baseModelName:
                title: Base model
                type: string
                default: distilbert-base-uncased
                description: HuggingFace Hub model id to fine-tune.
              learningRate:
                title: Learning rate
                type: number
              epochs:
                title: Epochs
                type: integer
              batchSize:
                title: Batch size
                type: integer
              optimizer:
                title: Optimizer
                type: string
                enum: [adam, sgd]
                default: adam

        # --- cv ---
        - if:
            required:
              - architecture
            properties:
              architecture:
                const: cv
          then:
            required:
              - learningRate
              - epochs
              - batchSize
            properties:
              learningRate:
                title: Learning rate
                type: number
              epochs:
                title: Epochs
                type: integer
              batchSize:
                title: Batch size
                type: integer
              optimizer:
                title: Optimizer
                type: string
                enum: [adam, sgd]
                default: adam

    - title: Dataset & Task
      required:
        - dataSource
        - datasetUri
      properties:
        # Descriptions stay short/user-facing — the "how" (which adapters
        # back these, why the value looks like a file:// path) belongs in
        # comments, not in front of someone picking a dataset from a list.
        dataSource:
          title: Data source
          type: string
          description: Where the dataset is stored — pick this before browsing the list below.
        # dataSourcePicker/datasetPicker (ui:options below) populate both
        # from GET /datasets, which merges every IObjectStorageAdapter
        # that's wired up (local filesystem, MinIO/S3, whatever gets added
        # later — no template change needed). Falls back to a plain
        # file:// text field if that list is empty/unreachable.
        datasetUri:
          title: Dataset name
          type: string
          description: >
            Dataset used for training — a .zip of images for Computer
            Vision, CSV for everything else.
        idColumns:
          title: ID columns to exclude
          type: array
          items:
            type: string
          description: >
            Identifier columns to drop before training (never used as a
            feature), e.g. "transaction_id".
          default: [transaction_id]
      ui:field: StepLayout
      ui:options:
        groups:
          - title: Dataset & Task
            icon: apps
            fields:
              - name: dataSource
                dataSourcePicker: true
              - name: datasetUri
                datasetPicker: true
                datasetPreview: true
                datasetValidation: true
          # Shared by targetColumn/timeColumn/textColumn — each only exists
          # in the branch-resolved schema for its own architecture/taskType
          # (set in the previous step), so this panel shows only what
          # applies, and disappears for combos with nothing (e.g.
          # clustering has no Target column).
          - title: Data columns
            icon: tune
            fields:
              - name: targetColumn
                width: 12
                columnPicker: single
              - name: timeColumn
                width: 6
                columnPicker: single
              - name: textColumn
                width: 6
                columnPicker: single
          - title: Exclude ID columns (optional)
            icon: list
            collapsible: true
            fields:
              - name: idColumns
                columnPicker: multi
      allOf:
        # --- lstm's time column — architecture is already in formData by
        # the time this step renders (the previous step requires it).
        # `required: [architecture]` kept anyway, same as every other
        # architecture-keyed branch in this template.
        - if:
            required:
              - architecture
            properties:
              architecture:
                const: lstm
          then:
            required:
              - timeColumn
            properties:
              timeColumn:
                title: Time column
                type: string
                description: >
                  Required for lstm — training always uses a chronological
                  split (TimeSeriesSplit) instead of a random one, to avoid
                  leaking future rows into the training set.

        # --- optional time-ordered split for non-lstm regression (e.g.
        # revenue-forecast/traffic-forecast on sklearn/xgboost/mlp) —
        # train.py's _split() already accepts time_column for ANY
        # architecture, not just lstm (see infra/argo-workflows/
        # training-image/train.py), this was just never exposed outside
        # the lstm branch above. Optional, not required: plain regression
        # works fine without it, this only matters for genuinely
        # time-ordered data.
        - if:
            required:
              - architecture
            properties:
              taskType:
                const: regression
              architecture:
                not:
                  const: lstm
          then:
            properties:
              timeColumn:
                title: Time column (optional)
                type: string
                description: >
                  Set this for time-ordered data to use a chronological
                  train/test split instead of a random one.

        # --- nlp's text column ---
        - if:
            required:
              - architecture
            properties:
              architecture:
                const: nlp
          then:
            required:
              - textColumn
            properties:
              textColumn:
                title: Text column
                type: string
                description: Column containing the text to classify.

        # --- target column: any architecture except cv, task != clustering/
        # anomaly-detection (the latter gets its own optional version below) ---
        - if:
            required:
              - architecture
            properties:
              taskType:
                enum: [classification, regression]
              architecture:
                not:
                  const: cv
          then:
            required:
              - targetColumn
            properties:
              targetColumn:
                title: Target column
                type: string
                description: >
                  Label column to predict — required for classification/
                  regression, leave empty for clustering. Doesn't apply to
                  architecture=cv (class comes from the image folder name).
                default: is_fraud
        # --- anomaly-detection's target column is optional — IsolationForest/
        # LocalOutlierFactor never train on it (train.py fits unsupervised
        # either way); if set, it's only used to compute precision/recall/f1
        # after the fact. No `required` here, unlike the branch above.
        - if:
            properties:
              taskType:
                const: anomaly-detection
          then:
            properties:
              targetColumn:
                title: Target column (optional)
                type: string
                description: >
                  Label column for evaluation only, e.g. "is_anomaly" —
                  precision/recall/f1 get computed against it if set.
                  Leave empty for a purely unsupervised run.
                default: is_anomaly

    # Both fields here default off (fixed / no Feast) — most runs skip
    # both, so they share one step instead of two near-empty ones.
    - title: Advanced customization (optional)
      properties:
        searchStrategy:
          title: Hyperparameter search strategy
          type: string
          enum: [fixed, grid, random, bayesian]
          default: fixed
          description: >
            "fixed" trains once, unchanged. "grid"/"random"/"bayesian" run
            multiple trials — configure the search below.
        useFeast:
          title: Enrich with Feast features
          type: boolean
          default: false
          description: Merges precomputed Feature Store features into the dataset before training.
      ui:field: StepLayout
      ui:options:
        groups:
          - title: Hyperparameter Search
            icon: tune
            fields:
              - name: searchStrategy
                width: 6
              # Only exists in the resolved schema once searchStrategy !=
              # fixed — a subpanel (dashed, child-of-a-decision) rather
              # than a sibling group, same convention as Algorithm's BYOC
              # block above.
              - subpanel:
                  title: Search configuration
                  fields:
                    - name: objectiveMetric
                      width: 6
                    - name: objectiveDirection
                      width: 6
                    - name: numTrials
                      width: 6
                    - name: searchSpaceJson
                      width: 12
                      searchSpaceBuilder: true
          - title: Feature enrichment (Feast)
            icon: list
            variant: optional
            toggleField: useFeast
            fields:
              - name: entityIdColumn
                width: 6
                columnPicker: single
              - name: featureNames
                width: 6
                featureNamesPicker: true
      allOf:
        - if:
            properties:
              searchStrategy:
                enum: [grid, random, bayesian]
          then:
            required:
              - objectiveMetric
            properties:
              searchSpaceJson:
                title: Search space
                type: string
                default: "{}"
                description: Unchecked hyperparameters stay fixed at the value from Architecture & Task.
              objectiveMetric:
                title: Objective metric
                type: string
                description: Metric to optimize across trials.
              objectiveDirection:
                title: Objective direction
                type: string
                enum: [maximize, minimize]
                default: maximize
        # --- objectiveMetric's options: exactly the metrics
        # evaluations/gate.py's TASK_TYPE_THRESHOLDS computes for the
        # taskType chosen back in Architecture & Task, so there's no way
        # to pick a metric this run will never produce. Re-checks
        # searchStrategy too — without it, each branch below would inject
        # `objectiveMetric` on its own regardless of searchStrategy (an
        # `allOf` sibling's `then` merges independently of the base
        # branch above), leaking the whole Search configuration subpanel
        # into view even for "fixed".
        - if:
            properties:
              searchStrategy:
                enum: [grid, random, bayesian]
              taskType:
                const: classification
          then:
            properties:
              objectiveMetric:
                enum: [accuracy, precision, recall, f1]
        - if:
            properties:
              searchStrategy:
                enum: [grid, random, bayesian]
              taskType:
                const: regression
          then:
            properties:
              objectiveMetric:
                enum: [r2, mean_absolute_percentage_error]
        - if:
            properties:
              searchStrategy:
                enum: [grid, random, bayesian]
              taskType:
                const: clustering
          then:
            properties:
              objectiveMetric:
                enum: [silhouette_score]
        # anomaly_rate is the only metric TASK_TYPE_THRESHOLDS gates on for
        # this taskType (evaluations/gate.py) — precision/recall/f1 also
        # get logged when targetColumn was set, but aren't gated on since
        # they're not always present, so they're intentionally left out
        # here too (an HPO objective this run might not produce would
        # silently never improve). No objectiveDirection const below,
        # unlike the other 3 branches: anomaly_rate has both a minimum and
        # a maximum threshold (a sanity range, not "higher/lower is
        # better"), so there's no single correct forced direction — stays
        # on the base field's own enum/default (maximize).
        - if:
            properties:
              searchStrategy:
                enum: [grid, random, bayesian]
              taskType:
                const: anomaly-detection
          then:
            properties:
              objectiveMetric:
                enum: [anomaly_rate]
        # --- objectiveDirection follows the chosen metric automatically
        # (every metric above is "higher is better" except MAPE) — forced
        # via `const`, same mechanism as architecture: {const: sklearn}
        # elsewhere, so once a metric is picked there's nothing left to
        # choose and StepLayout's renderField skips the field entirely.
        - if:
            required:
              - objectiveMetric
            properties:
              objectiveMetric:
                const: mean_absolute_percentage_error
          then:
            properties:
              objectiveDirection:
                const: minimize
        - if:
            required:
              - objectiveMetric
            properties:
              objectiveMetric:
                enum: [accuracy, precision, recall, f1, r2, silhouette_score]
          then:
            properties:
              objectiveDirection:
                const: maximize
        - if:
            properties:
              searchStrategy:
                enum: [random, bayesian]
          then:
            required:
              - numTrials
            properties:
              numTrials:
                title: Number of trials
                type: integer
                description: Ignored by "grid" — trial count there is the full grid size.
        - if:
            properties:
              useFeast:
                const: true
          then:
            required:
              - entityIdColumn
              - featureNames
            properties:
              entityIdColumn:
                title: Entity id column
                type: string
                description: Row identifier for the Feast lookup — pick the dataset column it's stored in.
              featureNames:
                title: Feature names
                type: array
                items:
                  type: string
                description: Pick from the features this Feast store actually has.

  steps:
    - id: enrich-features
      name: "Enrich dataset with Feast features"
      action: orchestration:enrich-dataset-features
      if: ${{ parameters.useFeast }}
      input:
        datasetUri: ${{ parameters.datasetUri }}
        entityIdColumn: ${{ parameters.entityIdColumn }}
        featureNames: ${{ parameters.featureNames }}

    - id: validate-dataset
      name: "Validate the dataset"
      action: orchestration:validate-dataset
      # Data Quality checks assume a CSV read via pd.read_csv — CV's
      # datasetUri is a .zip of images, skip this step.
      if: ${{ parameters.architecture !== 'cv' }}
      input:
        datasetUri: ${{ parameters.useFeast and steps['enrich-features'].output.datasetUri or parameters.datasetUri }}
        taskType: ${{ parameters.taskType }}
        targetColumn: ${{ parameters.targetColumn }}
        timeColumn: ${{ parameters.timeColumn }}

    - id: trigger-training
      name: "Train and register the model"
      action: orchestration:trigger-training
      input:
        modelName: ${{ parameters.modelName }}
        datasetUri: ${{ parameters.useFeast and steps['enrich-features'].output.datasetUri or parameters.datasetUri }}
        taskType: ${{ parameters.taskType }}
        architecture: ${{ parameters.architecture }}
        algorithm: ${{ parameters.algorithm }}
        targetColumn: ${{ parameters.targetColumn }}
        idColumns: ${{ parameters.idColumns }}
        timeColumn: ${{ parameters.timeColumn }}
        baseModelUri: ${{ parameters.baseModelUri }}
        hiddenLayers: ${{ parameters.hiddenLayers }}
        dropout: ${{ parameters.dropout }}
        sequenceLength: ${{ parameters.sequenceLength }}
        numLayers: ${{ parameters.numLayers }}
        hiddenSize: ${{ parameters.hiddenSize }}
        learningRate: ${{ parameters.learningRate }}
        epochs: ${{ parameters.epochs }}
        batchSize: ${{ parameters.batchSize }}
        optimizer: ${{ parameters.optimizer }}
        codeRepoUrl: ${{ parameters.codeRepoUrl }}
        entrypointPath: ${{ parameters.entrypointPath }}
        customConfig: ${{ parameters.customConfig }}
        searchStrategy: ${{ parameters.searchStrategy }}
        numTrials: ${{ parameters.numTrials }}
        searchSpaceJson: ${{ parameters.searchSpaceJson }}
        objectiveMetric: ${{ parameters.objectiveMetric }}
        objectiveDirection: ${{ parameters.objectiveDirection }}
        textColumn: ${{ parameters.textColumn }}
        baseModelName: ${{ parameters.baseModelName }}

    - id: model-summary
      name: "Fetch the model version's metrics"
      action: orchestration:model-summary
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ steps['trigger-training'].output.modelVersion }}

    - id: render-catalog-info
      name: "Generate the model's catalog entity"
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: catalog-output
        values:
          modelName: ${{ parameters.modelName }}
          modelVersion: ${{ steps['trigger-training'].output.modelVersion }}
          owner: ${{ parameters.owner }}
          # skeleton/catalog-info.yaml reads these two (businessDomain/
          # useCase) but nothing here ever forwarded them — every real run
          # rendered those two annotations empty.
          businessDomain: ${{ parameters.businessDomain }}
          useCase: ${{ parameters.useCase }}

    - id: publish-catalog-pr
      name: "Open the catalog entry PR"
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: register-${{ parameters.modelName }}-${{ steps['trigger-training'].output.modelVersion }}
        title: "Register ${{ parameters.modelName }}:${{ steps['trigger-training'].output.modelVersion }}"
        description: >
          Adds the Catalog entry for **${{ parameters.modelName }}** version
          **${{ steps['trigger-training'].output.modelVersion }}**, trained
          with ${{ parameters.algorithm }} (${{ parameters.taskType }}).
        sourcePath: catalog-output
        targetPath: catalog/${{ parameters.modelName }}

  output:
    links:
      - title: View run in MLflow
        url: http://localhost:5000
      - title: View catalog entry pull request
        url: ${{ steps['publish-catalog-pr'].output.remoteUrl }}
    text:
      - title: Result
        content: |
          Trained and registered **${{ parameters.modelName }}** version
          **${{ steps['trigger-training'].output.modelVersion }}**
          (${{ parameters.algorithm }}, Argo Workflow
          `${{ steps['trigger-training'].output.workflowName }}`, finished
          as `${{ steps['trigger-training'].output.phase }}`).

          Metrics: `${{ steps['model-summary'].output.metrics }}`

          Catalog entry PR opened:
          ${{ steps['publish-catalog-pr'].output.remoteUrl }} — merge it to
          make the entity discoverable (add its path to `catalog.locations`
          per `CLAUDE.md`'s "Adding a Catalog entity" workflow rule).
