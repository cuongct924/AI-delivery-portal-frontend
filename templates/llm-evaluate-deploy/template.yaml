apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: llm-evaluate-deploy
  title: "Evaluate & Activate Prompt / RAG Version"
  description: >
    Evaluates a drafted prompt or RAG index version with an LLM judge and
    activates it immediately if it passes.
  tags:
    - llmops

spec:
  owner: user:guest
  type: service

  parameters:
    - title: What to evaluate
      required:
        - artifactKind
        - evalCases
      properties:
        artifactKind:
          title: Artifact kind
          type: string
          oneOf:
            - const: prompt
              title: 'Prompt - a persona''s drafted system prompt version'
            - const: rag-index
              title: 'RAG Index - a Qdrant collection''s drafted index version'
          description: >
            Choose which drafted artifact to evaluate and, if it passes,
            activate.
        evalCases:
          title: Eval cases
          type: array
          items:
            type: string
          default:
            - How does IDP manage the model lifecycle?
          description: >
            Questions to run through the LLM judge. Add one per line; no
            JSON wrapper is needed.
        model:
          title: Judge model
          type: string
          default: claude-sonnet-5
          description: >
            Any model_name registered in infra/llm-gateways/litellm-config.yaml
            — including a self-hosted model deployed via the Serving LLM
            Golden Path, not just Claude.
      # promptName/promptVersion and collectionName/indexVersion only exist
      # in the resolved schema once artifactKind actually picks their
      # branch — same fix as llm-draft-register's own Prompt/RAG Index
      # panels, which previously stayed visible together regardless of
      # artifactKind because their fields were declared unconditionally in
      # the base `properties` above instead of gated behind this allOf.
      # `required: [artifactKind]` on each `if` keeps neither panel showing
      # before a choice is made.
      allOf:
        - if:
            required: [artifactKind]
            properties:
              artifactKind:
                const: prompt
          then:
            required:
              - promptName
              - promptVersion
            properties:
              promptName:
                title: Persona key
                type: string
                description: The persona drafted in Golden Path #1 (Draft Prompt).
              promptVersion:
                title: Prompt version
                type: string
                description: The version number Golden Path #1's output reported.
        - if:
            required: [artifactKind]
            properties:
              artifactKind:
                const: rag-index
          then:
            required:
              - collectionName
              - indexVersion
            properties:
              collectionName:
                title: Qdrant collection
                type: string
                description: The collection ingested in Golden Path #1 (Ingest RAG Index).
              indexVersion:
                title: RAG index version
                type: string
                description: The version number Golden Path #1's output reported.
      # Same StepLayout field extension llm-draft-register/train-track-
      # register use — only changes how this step looks, field names/values
      # resolve exactly as before.
      ui:field: StepLayout
      ui:options:
        groups:
          - title: What to evaluate
            fields:
              - artifactKind
          - title: 'Prompt (when Artifact kind = Prompt)'
            fields:
              - name: promptName
                width: 6
                promptNamePicker: true
              - name: promptVersion
                width: 6
                promptVersionPicker: true
          - title: 'RAG Index (when Artifact kind = RAG Index)'
            fields:
              - name: collectionName
                width: 6
                ragCollectionPicker: true
              - name: indexVersion
                width: 6
                ragIndexVersionPicker: true
          - title: Evaluation
            fields:
              - evalCases
              - name: model
                width: 6
                llmModelPicker: true

  steps:
    - id: evaluate-prompt
      name: "Evaluate the prompt"
      action: orchestration:evaluate-prompt
      if: ${{ parameters.artifactKind === 'prompt' }}
      input:
        name: ${{ parameters.promptName }}
        version: ${{ parameters.promptVersion }}
        evalCases: ${{ parameters.evalCases }}
        model: ${{ parameters.model }}

    - id: evaluate-rag
      name: "Evaluate the RAG index"
      action: orchestration:rag-evaluate
      if: ${{ parameters.artifactKind === 'rag-index' }}
      input:
        collection: ${{ parameters.collectionName }}
        indexVersion: ${{ parameters.indexVersion }}
        evalCases: ${{ parameters.evalCases }}
        model: ${{ parameters.model }}

    - id: activate-prompt
      name: "Activate the prompt"
      action: orchestration:activate-prompt
      if: ${{ parameters.artifactKind === 'prompt' and steps['evaluate-prompt'].output.passed }}
      input:
        name: ${{ parameters.promptName }}
        version: ${{ parameters.promptVersion }}

    - id: activate-rag
      name: "Activate the RAG index"
      action: orchestration:rag-activate
      if: ${{ parameters.artifactKind === 'rag-index' and steps['evaluate-rag'].output.passed }}
      input:
        collection: ${{ parameters.collectionName }}
        indexVersion: ${{ parameters.indexVersion }}

  output:
    text:
      - title: Result
        content: |
          {% if parameters.artifactKind === 'prompt' %}
          Evaluate Gate for prompt **${{ parameters.promptName }}** version
          **${{ parameters.promptVersion }}**: pass_rate =
          {{ steps['evaluate-prompt'].output.passRate }}. Cost:
          {{ steps['evaluate-prompt'].output.totalTokens }} tokens
          {% if steps['evaluate-prompt'].output.totalCostUsd %}
          (${{ steps['evaluate-prompt'].output.totalCostUsd }})
          {% else %}
          (no pricing entry in litellm-config.yaml for this model)
          {% endif %}
          {% if steps['evaluate-prompt'].output.passed %}
          **Activated.** `routers/chat.py` now uses this version for
          persona `${{ parameters.promptName }}`.
          {% else %}
          **Not activated** — pass_rate below 0.8. Draft a new version
          (LLMOps Golden Path #1) and try again.
          {% endif %}
          {% else %}
          Evaluate Gate for RAG index **${{ parameters.collectionName }}**
          version **${{ parameters.indexVersion }}**: pass_rate =
          {{ steps['evaluate-rag'].output.passRate }}. Cost:
          {{ steps['evaluate-rag'].output.totalTokens }} tokens
          {% if steps['evaluate-rag'].output.totalCostUsd %}
          (${{ steps['evaluate-rag'].output.totalCostUsd }})
          {% else %}
          (no pricing entry in litellm-config.yaml for this model)
          {% endif %}
          {% if steps['evaluate-rag'].output.passed %}
          **Activated.** `routers/chat.py` now retrieves from this version
          when `use_rag=true, rag_collection=${{ parameters.collectionName }}`.
          {% else %}
          **Not activated** — pass_rate below 0.8. Ingest a new version
          (LLMOps Golden Path #1) and try again.
          {% endif %}
          {% endif %}
