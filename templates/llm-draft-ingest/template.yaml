apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: llm-draft-ingest
  title: 'Draft Prompt / Ingest RAG Data / Draft Eval Set'
  description: >
    Draft a prompt, ingest documents into a RAG index, or register a reusable
    eval set.
  tags:
    - llmops
  links:
    - title: Troubleshooting FAQ
      url: http://localhost:3000/docs/default/system/ai-delivery-portal/troubleshooting-faq

spec:
  owner: user:guest
  type: service

  parameters:
    - title: 'Draft Prompt / Ingest RAG Data / Draft Eval Set'
      description: >
        Pick what to create, then fill in only that artifact's fields. Nothing
        goes live here — evaluate and activate it in the next Golden Path.
      required:
        - artifactKind
      properties:
        artifactKind:
          title: Artifact kind
          type: string
          oneOf:
            - const: prompt
              title: 'Prompt - system prompt for a persona'
            - const: rag-index
              title: 'RAG Index - ingest documents into a Qdrant collection'
            - const: eval-set
              title: 'Eval Set - reusable set of eval questions for the Evaluate Gate'
          # Rendered as a row of cards (StepLayoutField's choiceCards) — the
          # three kinds have genuinely different follow-up forms, so scanning
          # labels+captions beats reading one dense paragraph under a dropdown.
          x-cards:
            - value: prompt
              label: Prompt
              caption: Draft a system prompt for a persona
              icon: bolt
            - value: rag-index
              label: RAG Index
              caption: Ingest documents into a Qdrant collection
              icon: list
            - value: eval-set
              label: Eval Set
              caption: Reusable set of eval questions for the Evaluate Gate
              icon: query_stats
          default: prompt
          description: >
            Choose the artifact type to create.
        # Pre-flight FinOps panel (StepLayoutField's costEstimate flag) —
        # calls the same /costs/estimate + /costs/check the estimate-cost/
        # cost-gate steps below call at submit time. Its own value is never
        # read; only its group placement matters.
        costEstimate:
          title: Cost estimate
          type: string
          readOnly: true
          # Carries the golden path name so the Review step can resolve the
          # same estimate config; the panel itself reads its ui:options.
          default: llm-draft-ingest
          description: Computed automatically — nothing to fill in.
        # Security control surface (StepLayoutField's securityScan flag) —
        # a RAG ingest is where data leaves its boundary, so classification
        # and PII masking are blocking; the prompt half adds injection scan.
        dataClassification:
          title: Data classification
          type: string
          oneOf:
            - const: public
              title: Public
            - const: internal
              title: Internal
            - const: confidential
              title: Confidential
            - const: restricted
              title: Restricted
          default: internal
          description: >
            Tag the ingested data. Confidential/restricted requires PII
            detection & masking below.
        piiScan:
          title: PII detection & masking
          type: boolean
          default: true
          description: Scan and mask PII before it reaches the index.
        injectionDetection:
          title: Prompt-injection detection
          type: boolean
          default: true
          description: Scan drafted prompt content for injection patterns.
        auditLogging:
          title: Inference audit trail
          type: boolean
          default: true
          description: Record every draft/ingest with actor and artifact.
        securityScan:
          title: Security posture
          type: string
          readOnly: true
          default: llm-draft-ingest
          description: Computed automatically — nothing to fill in.
      # promptName/personaTitle/promptContent and collectionName/sourcePaths/
      # chunkSize/chunkOverlap only exist in the resolved schema once
      # artifactKind actually picks their branch (same "field only exists
      # where it applies" mechanism as train-track-register's
      # finetuneEnabled/baseModelUri) — previously these were unconditional
      # base `properties`, so StepLayout's hasAnyRenderable() found them
      # renderable regardless of artifactKind and showed both the Prompt and
      # RAG Index panels at once. `required: [artifactKind]` on each `if`
      # keeps neither panel showing before a choice is made (artifactKind has
      # no default on purpose — see its own description above).
      allOf:
        - if:
            required: [artifactKind]
            properties:
              artifactKind:
                const: prompt
          then:
            required:
              - promptName
              - personaTitle
              - promptContent
            properties:
              promptName:
                title: Persona key
                type: string
                default: llmops
                description: >
                  Persona key reused by Golden Path #2 (Evaluate & Activate)
                  and routers/chat.py. Example: "llmops".
              personaTitle:
                title: Persona display name
                type: string
                default: LLMOps Assistant
                description: 'Name shown in the Prompt Registry UI. Example: "LLMOps Assistant".'
              promptContent:
                title: System prompt content
                type: string
                ui:widget: textarea
                ui:options:
                  rows: 14
                default: >
                  You are the LLMOps Assistant for the AI Delivery Portal.
                  Answer questions about model training, tracking, registration,
                  deployment and monitoring using the platform's own Golden
                  Paths. Be concise and concrete.
                description: >
                  Full system prompt content. Supports multiline text.
        - if:
            required: [artifactKind]
            properties:
              artifactKind:
                const: rag-index
          then:
            required:
              - collectionMode
              - sourcePaths
            properties:
              # Ingest into an existing collection (picked from a dropdown, so
              # a typo can't spawn a junk collection) or create a new one
              # (typed, with a naming pattern). The two branches below add the
              # matching field only for the chosen mode.
              collectionMode:
                title: Collection
                type: string
                oneOf:
                  - const: existing
                    title: Ingest into an existing collection
                  - const: new
                    title: Create a new collection
                x-cards:
                  - value: existing
                    label: Existing collection
                    caption: Add a new index version to a collection that exists
                    icon: list
                  - value: new
                    label: New collection
                    caption: Create a brand-new Qdrant collection
                    icon: apps
                default: existing
                description: >
                  Pick an existing Qdrant collection, or create a new one.
              sourcePaths:
                title: Source document paths
                type: array
                items:
                  type: string
                # docs/playbook-ai-delivery-portal.md is deliberately NOT a
                # default here — it's exam-defense prep notes written for a
                # mentor/thesis-committee audience ("em đã...", scope-
                # justification framing), not operational documentation. If
                # RAG-ingested, the chat assistant would answer real
                # engineering questions in that register instead of giving
                # actual operational guidance. Use the docs below instead.
                default:
                  - docs/architecture-overview.md
                  - docs/troubleshooting-faq.md
                  - docs/glossary-openchoreo.md
                description: >
                  Pick the documents to ingest from the list of real repo docs
                  (GET /rag/sources). Paths are repo-relative, e.g.
                  "docs/architecture-overview.md".
              chunkSize:
                title: Chunk size (characters)
                type: integer
                default: 800
                description: >
                  Smaller chunks improve retrieval precision but increase
                  embedding cost and noise. Larger chunks preserve more
                  context but may mix unrelated content. 800 is a good
                  starting point for technical docs.
              chunkOverlap:
                title: Chunk overlap (characters)
                type: integer
                default: 100
                description: >
                  Characters shared by adjacent chunks to preserve context
                  across boundaries. Usually set to 10-15% of chunkSize
                  (80-120 for 800).
        # Existing collection: a strict dropdown of what Qdrant actually has.
        - if:
            required: [artifactKind, collectionMode]
            properties:
              artifactKind:
                const: rag-index
              collectionMode:
                const: existing
          then:
            required:
              - collectionName
            properties:
              collectionName:
                title: Qdrant collection
                type: string
                default: idp-docs
                description: 'Existing collection to ingest into.'
        # New collection: typed, with a naming pattern so it can't drift from
        # the convention (lowercase, no spaces).
        - if:
            required: [artifactKind, collectionMode]
            properties:
              artifactKind:
                const: rag-index
              collectionMode:
                const: new
          then:
            required:
              - newCollectionName
            properties:
              newCollectionName:
                title: New collection name
                type: string
                pattern: '^[a-z0-9][a-z0-9_-]*$'
                default: idp-docs
                description: >
                  Lowercase letters, digits, hyphens and underscores only.
                  Example: "idp-docs".
        - if:
            required: [artifactKind]
            properties:
              artifactKind:
                const: eval-set
          then:
            required:
              - evalSetName
              - evalSetQuestions
            properties:
              evalSetName:
                title: Eval-set name
                type: string
                default: idp-qna-eval
                description: >
                  Reused by "Evaluate & Activate Prompt / RAG Version" —
                  pick this same name there instead of retyping questions
                  every run, so successive versions of an artifact are
                  graded against the same benchmark.
              evalSetQuestions:
                title: Questions
                type: array
                items:
                  type: string
                default:
                  - How does IDP manage the model lifecycle?
                description: >
                  Questions to run through the LLM judge. Add one per line;
                  no JSON wrapper is needed.
      # Reuse the StepLayout field extension without changing field names or values.
      ui:field: StepLayout
      ui:options:
        groups:
          - title: Artifact type
            icon: category
            fields:
              - name: artifactKind
                choiceCards: true
          - title: 'Prompt (when Artifact kind = Prompt)'
            icon: description
            fields:
              - name: promptName
                width: 6
                # Free-solo combobox of existing persona keys (GET /prompts):
                # pick one to add a version to, or type a new key to create a
                # persona — avoids the typo class (ml-ops/ml_ops) that a plain
                # free-text field allowed, while still supporting new personas.
                promptNameCombo: true
              - name: personaTitle
                width: 6
              - promptContent
          - title: 'RAG Index (when Artifact kind = RAG Index)'
            icon: library_books
            fields:
              - name: collectionMode
                width: 12
                choiceCards: true
              # Strict dropdown of existing collections (GET /rag/collections);
              # only rendered in the "existing" branch.
              - name: collectionName
                ragCollectionPicker: true
              - name: newCollectionName
              - name: chunkSize
                width: 3
              - name: chunkOverlap
                width: 3
              # Multi-select of real docs (GET /rag/sources) — a Dev picks
              # paths that exist instead of typing one that 400s the ingest.
              - name: sourcePaths
                sourcePathsPicker: true
          - title: 'Eval Set (when Artifact kind = Eval Set)'
            icon: checklist
            fields:
              - name: evalSetName
                # Free-solo combobox of existing eval-set names (GET
                # /eval-sets): pick one to add a version to, or type a new
                # name to create a set — avoids the typo class
                # (idp-qna_eval vs idp-qna-eval) that a plain free-text field
                # allowed, while still supporting new sets.
                evalSetNameCombo: true
              - evalSetQuestions
          - title: Security
            icon: security
            fields:
              - name: dataClassification
                width: 6
              - name: piiScan
                width: 6
              - name: injectionDetection
                width: 6
              - name: auditLogging
                width: 6
              - name: securityScan
                securityScan:
                  goldenPath: llm-draft-ingest
                  stage: build
                  artifactFields:
                    [newCollectionName, collectionName, evalSetName, promptName]
                  paramFields:
                    [
                      dataClassification,
                      piiScan,
                      injectionDetection,
                      auditLogging,
                    ]
          - title: Cost estimate
            icon: attach_money
            fields:
              - name: costEstimate
                costEstimate:
                  goldenPath: llm-draft-ingest
                  stage: build
                  artifactFields:
                    [newCollectionName, collectionName, evalSetName, promptName]
                  paramFields: [artifactKind]

  steps:
    # Pre-flight FinOps: estimate the build cost of the draft/ingest, tagged
    # with the `build` stage and attributed to the artifact being produced.
    - id: estimate-cost
      name: 'Estimate the build cost'
      action: orchestration:estimate-cost
      input:
        goldenPath: llm-draft-ingest
        stage: build
        artifact: ${{ parameters.artifactKind === 'rag-index' and (parameters.collectionMode === 'new' and parameters.newCollectionName or parameters.collectionName) or (parameters.artifactKind === 'eval-set' and parameters.evalSetName or parameters.promptName) }}
        params:
          artifactKind: ${{ parameters.artifactKind }}

    # Pre-flight cost guardrail: warn (never block) when the estimate is over
    # budget. Flip mode to `enforce` to block a fail-level overrun.
    - id: cost-gate
      name: 'Check the cost budget'
      action: orchestration:cost-gate
      input:
        # Block a fail-level overrun (the estimate step above only warns).
        mode: enforce
        goldenPath: llm-draft-ingest
        stage: build
        artifact: ${{ parameters.artifactKind === 'rag-index' and (parameters.collectionMode === 'new' and parameters.newCollectionName or parameters.collectionName) or (parameters.artifactKind === 'eval-set' and parameters.evalSetName or parameters.promptName) }}
        params:
          artifactKind: ${{ parameters.artifactKind }}

    # Pre-flight security scan: a RAG ingest of confidential/restricted data
    # without PII masking is blocked before anything is embedded.
    - id: security-scan
      name: 'Scan the security posture'
      action: orchestration:security-scan
      input:
        goldenPath: llm-draft-ingest
        stage: build
        artifact: ${{ parameters.artifactKind === 'rag-index' and (parameters.collectionMode === 'new' and parameters.newCollectionName or parameters.collectionName) or (parameters.artifactKind === 'eval-set' and parameters.evalSetName or parameters.promptName) }}
        params:
          dataClassification: ${{ parameters.dataClassification }}
          piiScan: ${{ parameters.piiScan }}
          injectionDetection: ${{ parameters.injectionDetection }}
          auditLogging: ${{ parameters.auditLogging }}

    - id: draft-prompt
      name: 'Draft the prompt'
      action: orchestration:draft-prompt
      if: ${{ parameters.artifactKind === 'prompt' }}
      input:
        name: ${{ parameters.promptName }}
        persona: ${{ parameters.personaTitle }}
        content: ${{ parameters.promptContent }}

    - id: rag-ingest
      name: 'Ingest the RAG index'
      action: orchestration:rag-ingest
      if: ${{ parameters.artifactKind === 'rag-index' }}
      input:
        collection: ${{ parameters.collectionMode === 'new' and parameters.newCollectionName or parameters.collectionName }}
        sourcePaths: ${{ parameters.sourcePaths }}
        chunkSize: ${{ parameters.chunkSize }}
        chunkOverlap: ${{ parameters.chunkOverlap }}

    - id: draft-eval-set
      name: 'Draft the eval set'
      action: orchestration:draft-eval-set
      if: ${{ parameters.artifactKind === 'eval-set' }}
      input:
        name: ${{ parameters.evalSetName }}
        questions: ${{ parameters.evalSetQuestions }}

  output:
    # Pre-flight FinOps recap — the same estimate/gate the form panel showed,
    # surfaced on the task result. Values are empty when the estimate step was
    # skipped (e.g. a non-deploy action); the card then renders nothing.
    costGoldenPath: llm-draft-ingest
    costStage: build
    costEstimated: ${{ steps['estimate-cost'].output.estimatedCost }}
    costLevel: ${{ steps['cost-gate'].output.level }}
    costBudget: ${{ steps['cost-gate'].output.budget }}
    costReasons: ${{ steps['cost-gate'].output.reasons }}
    costAlternatives: ${{ steps['cost-gate'].output.alternatives }}
    securityScore: ${{ steps['security-scan'].output.score }}
    securityPassed: ${{ steps['security-scan'].output.passed }}
    text:
      - title: Result
        content: |
          Security posture: **${{ steps['security-scan'].output.score }}/100** —
          data classification, PII masking and the audit trail are enforced.

          {% if parameters.artifactKind === 'prompt' %}
          Prompt **${{ parameters.promptName }}** version
          **${{ steps['draft-prompt'].output.version }}** drafted and is not active.

          Run **"Evaluate & Activate Prompt / RAG Version"** with:
          `artifactKind=prompt`, `promptName=${{ parameters.promptName }}`,
          `promptVersion=${{ steps['draft-prompt'].output.version }}`.
          {% elif parameters.artifactKind === 'rag-index' %}
          **${{ parameters.collectionMode === 'new' and parameters.newCollectionName or parameters.collectionName }}** index version
          **${{ steps['rag-ingest'].output.indexVersion }}**
          (${{ steps['rag-ingest'].output.chunksIngested }} chunks) ingested and is not active.

          Run **"Evaluate & Activate Prompt / RAG Version"** with:
          `artifactKind=rag-index`,
          `collectionName=${{ parameters.collectionMode === 'new' and parameters.newCollectionName or parameters.collectionName }}`,
          `indexVersion=${{ steps['rag-ingest'].output.indexVersion }}`.
          {% else %}
          Eval set **${{ parameters.evalSetName }}** version
          **${{ steps['draft-eval-set'].output.version }}** registered
          (${{ parameters.evalSetQuestions.length }} questions).

          Run **"Evaluate & Activate Prompt / RAG Version"** and enter
          `evalSetName=${{ parameters.evalSetName }}` instead of retyping
          eval cases — it always uses this set's latest version.
          {% endif %}
