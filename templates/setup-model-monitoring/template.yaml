apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: setup-model-monitoring
  title: 'Set Up Model Monitoring'
  description: >
    Schedule recurring drift checks for a deployed model, with optional
    auto-retraining.
  tags:
    - mlops
    - monitoring
  links:
    - title: Troubleshooting FAQ
      url: /docs/default/system/ai-delivery-portal/troubleshooting-faq

spec:
  owner: user:guest
  type: service

  parameters:
    - title: Model and monitoring signal
      description: >
        Pick the registered model to watch and how often to check it. The
        reference data is attached automatically from the model's training
        lineage.
      required:
        - modelName
        - modelVersion
        - referenceDataUri
        - productionDataSource
        - schedulePreset
        - monitoringType
      properties:
        modelName:
          title: Model name
          type: string
          default: fraud-detection
          description: Must already be registered (any Golden Path).
        modelVersion:
          title: Model version
          type: string
          default: '1'
        # Auto-bound from the selected model version's registry metadata
        # (StepLayoutField's taskType binding) — the Dev never picks it, and
        # it drives both the metrics table below and the retrain request's
        # task_type, so neither can disagree with the model.
        taskType:
          title: Task type
          type: string
          readOnly: true
          description: Detected from the model's registry metadata.
        referenceDataUri:
          title: Reference (training) data URI
          type: string
          description: >
            Auto-filled from the model's training lineage and locked — change
            the model to change it. Manual pick for versions without lineage.
        productionDataSource:
          title: Production data source
          type: string
          oneOf:
            - const: managed-prediction-log
              title: Platform-managed prediction log (recommended)
            - const: custom-uri
              title: Custom URI (advanced)
          default: managed-prediction-log
          description: >
            Platform-managed reads the deployed model's prediction log. Use
            Custom URI only for data managed outside the platform.
        schedulePreset:
          title: Monitoring frequency
          type: string
          oneOf:
            - const: hourly
              title: Hourly
            - const: daily
              title: Daily (recommended)
            - const: weekly
              title: Weekly
            - const: custom
              title: Custom cron (advanced)
          default: daily
          description: Choose how often the monitoring job should run.
        monitoringType:
          title: Detection signal
          type: string
          enum:
            - data-drift
            - performance-degradation
          default: data-drift
          description: >
            Data drift = changed input distribution. Performance degradation =
            a quality-metric drop (needs recent labels).
        onDriftDetected:
          title: On drift detected
          type: string
          enum: [alert-only, auto-retrain]
          default: alert-only
          description: >
            alert-only logs the run to MLflow. auto-retrain also triggers
            training — risky if the drift check false-positives.
        # Pre-flight FinOps panel (StepLayoutField's costEstimate flag) —
        # calls the same /costs/estimate + /costs/check the estimate-cost/
        # cost-gate steps below call at submit time. Its own value is never
        # read; only its group placement matters.
        costEstimate:
          title: Cost estimate
          type: string
          readOnly: true
          # Carries the golden path name so the Review step can resolve the
          # same estimate config; the panel itself reads its ui:options.
          default: setup-model-monitoring
          description: Computed automatically — nothing to fill in.
        # Security control surface (StepLayoutField's securityScan flag) —
        # the monitoring schedule is the drift/compliance control itself;
        # these add the audit and reporting half of the surface.
        auditLogging:
          title: Inference audit trail
          type: boolean
          default: true
          description: Record every monitoring run with actor and artifact.
        complianceReport:
          title: Compliance reporting
          type: boolean
          default: true
          description: Emit a periodic compliance report from the audit trail.
        modelSigning:
          title: Model signing
          type: boolean
          default: false
          description: Verify the monitored artifact's signature before each run.
        securityScan:
          title: Security posture
          type: string
          readOnly: true
          default: setup-model-monitoring
          description: Computed automatically — nothing to fill in.
      allOf:
        - if:
            properties:
              schedulePreset:
                const: hourly
          then:
            properties:
              schedule:
                const: '0 * * * *'
            required: [schedule]
        - if:
            properties:
              schedulePreset:
                const: daily
          then:
            properties:
              schedule:
                const: '0 0 * * *'
            required: [schedule]
        - if:
            properties:
              schedulePreset:
                const: weekly
          then:
            properties:
              schedule:
                const: '0 0 * * 0'
            required: [schedule]
        - if:
            properties:
              schedulePreset:
                const: custom
          then:
            properties:
              schedule:
                title: Custom cron expression
                type: string
                pattern: '^([0-9*/?,LW#-]+\s+){4}[0-9*/?,LW#-]+$'
                description: Standard 5-field cron expression.
            required: [schedule]
        - if:
            properties:
              productionDataSource:
                const: custom-uri
          then:
            properties:
              productionDataUri:
                title: Custom production data URI
                type: string
                default: s3://prediction-logs/fraud-detection/production.csv
                description: >
                  URI containing recent production inputs or predictions,
                  for example s3://bucket/path or file:///data/production.csv.
            required:
              - productionDataUri
        - if:
            properties:
              monitoringType:
                const: performance-degradation
          then:
            properties:
              groundTruthDataSource:
                title: Ground-truth source
                type: string
                oneOf:
                  - const: managed-label-log
                    title: Platform-managed delayed labels (recommended)
                  - const: custom-uri
                    title: Custom URI (advanced)
                default: managed-label-log
                description: >
                  Use the managed label stream when production labels are
                  delivered to the platform after inference.
              # Rendered by StepLayoutField's taskTypeMetrics flag as a
              # task-type-aware table: only the metrics that apply to the
              # selected model's task_type show, each with its own
              # minimum-acceptable threshold. `x-threshold` seeds a metric's
              # default; `x-task-type` (on retrainAlgorithm below) hides
              # options that don't fit the model.
              metricNames:
                title: Performance metrics & thresholds
                type: array
                items:
                  oneOf:
                    - const: f1_score
                      title: F1-score
                      x-threshold: 0.85
                    - const: accuracy
                      title: Accuracy
                      x-threshold: 0.9
                    - const: precision
                      title: Precision
                      x-threshold: 0.8
                    - const: recall
                      title: Recall
                      x-threshold: 0.8
                    - const: rmse
                      title: RMSE
                      x-threshold: 1.0
                    - const: mae
                      title: MAE
                      x-threshold: 1.0
                    - const: r2_score
                      title: R2-score
                      x-threshold: 0.8
                default:
                  - f1_score
                minItems: 1
                uniqueItems: true
                description: >
                  Pick the metrics to watch and set each one's minimum
                  acceptable value. Watching several at once avoids a single
                  metric hiding a real regression (e.g. high accuracy on
                  imbalanced data while recall collapses). Degradation is
                  flagged when ANY selected metric crosses its threshold.
              # Written by the metricNames field's taskTypeMetrics flag —
              # declared here so it's a real schema property (RJSF validates
              # it) and hidden in the group so it doesn't also render raw.
              metricThresholds:
                title: Metric thresholds
                type: object
                additionalProperties:
                  type: number
            required:
              - groundTruthDataSource
              - metricNames
        - if:
            properties:
              monitoringType:
                const: performance-degradation
          then:
            allOf:
              - if:
                  properties:
                    groundTruthDataSource:
                      const: custom-uri
                then:
                  properties:
                    groundTruthDataUri:
                      title: Custom ground-truth data URI
                      type: string
                      default: s3://label-logs/fraud-detection/labels.csv
                      description: >
                        URI containing delayed labels aligned with the
                        production predictions.
                  required:
                    - groundTruthDataUri
        - if:
            properties:
              monitoringType:
                const: data-drift
          then:
            properties:
              driftThreshold:
                title: Drift threshold (share of columns)
                type: number
                default: 0.5
                minimum: 0
                maximum: 1
                description: >
                  Share of columns Evidently must flag as drifted (0-1)
                  before this counts as drift detected.
        - if:
            properties:
              onDriftDetected:
                const: auto-retrain
          then:
            properties:
              # No retrainTaskType field: the model's own task_type (bound
              # above) is what the retrain request uses, so a Dev can't pick
              # a task type that disagrees with the model. The algorithm
              # options are filtered to that task type via x-task-type.
              retrainAlgorithm:
                title: Retrain algorithm
                type: string
                oneOf:
                  - const: LogisticRegression
                    title: Logistic Regression
                    x-task-type: classification
                  - const: RandomForestClassifier
                    title: Random Forest Classifier
                    x-task-type: classification
                  - const: GradientBoostingClassifier
                    title: Gradient Boosting Classifier
                    x-task-type: classification
                  - const: XGBClassifier
                    title: XGBoost Classifier
                    x-task-type: classification
                  - const: LinearRegression
                    title: Linear Regression
                    x-task-type: regression
                  - const: RandomForestRegressor
                    title: Random Forest Regressor
                    x-task-type: regression
                  - const: GradientBoostingRegressor
                    title: Gradient Boosting Regressor
                    x-task-type: regression
                  - const: XGBRegressor
                    title: XGBoost Regressor
                    x-task-type: regression
                  - const: KMeans
                    title: K-Means
                    x-task-type: clustering
                  - const: DBSCAN
                    title: DBSCAN
                    x-task-type: clustering
                  - const: AgglomerativeClustering
                    title: Agglomerative Clustering
                    x-task-type: clustering
                default: LogisticRegression
                description: Select an approved algorithm for reactive retraining.
            required:
              - retrainAlgorithm

      ui:field: StepLayout
      ui:options:
        groups:
          - title: Model and data
            icon: storage
            fields:
              - name: modelName
                width: 6
                modelNamePicker: true
              - name: modelVersion
                width: 6
                modelVersionPicker: true
              - name: taskType
                width: 6
                readOnlyDisplay: true
              - name: referenceDataUri
                datasetPicker: true
              - name: productionDataSource
                width: 6
              - name: productionDataUri
                width: 6
              - name: schedulePreset
                width: 6
              - name: schedule
                width: 6
          - title: Detection signal
            icon: query_stats
            fields:
              - monitoringType
              - driftThreshold
              - groundTruthDataSource
              - groundTruthDataUri
              - name: metricNames
                taskTypeMetrics: true
              - name: metricThresholds
                hidden: true
          - title: Response
            icon: notifications
            fields:
              - onDriftDetected
              - name: retrainAlgorithm
                taskTypeOptions: true
          - title: Security
            icon: security
            fields:
              - name: auditLogging
                width: 6
              - name: complianceReport
                width: 6
              - name: modelSigning
                width: 6
              - name: securityScan
                securityScan:
                  goldenPath: setup-model-monitoring
                  stage: run
                  artifactFields: [modelName]
                  paramFields: [auditLogging, complianceReport, modelSigning]
          - title: Cost estimate
            icon: attach_money
            fields:
              - name: costEstimate
                costEstimate:
                  goldenPath: setup-model-monitoring
                  stage: run
                  artifactFields: [modelName]
                  paramFields: [schedule]

  steps:
    # Pre-flight FinOps: estimate the recurring monitoring compute before the
    # schedule is registered, tagged with the `run` stage.
    - id: estimate-cost
      name: 'Estimate the monitoring cost'
      action: orchestration:estimate-cost
      input:
        goldenPath: setup-model-monitoring
        stage: run
        artifact: ${{ parameters.modelName }}
        params:
          schedule: ${{ parameters.schedule }}

    # Pre-flight cost guardrail: warn (never block) when the estimate is over
    # budget. Flip mode to `enforce` to block a fail-level overrun.
    - id: cost-gate
      name: 'Check the cost budget'
      action: orchestration:cost-gate
      input:
        # Block a fail-level overrun (the estimate step above only warns).
        mode: enforce
        goldenPath: setup-model-monitoring
        stage: run
        artifact: ${{ parameters.modelName }}
        params:
          schedule: ${{ parameters.schedule }}

    # Pre-flight security scan: the monitoring schedule is the drift control;
    # this checks the audit/compliance half of the surface.
    - id: security-scan
      name: 'Scan the security posture'
      action: orchestration:security-scan
      input:
        goldenPath: setup-model-monitoring
        stage: run
        artifact: ${{ parameters.modelName }}
        params:
          auditLogging: ${{ parameters.auditLogging }}
          complianceReport: ${{ parameters.complianceReport }}
          modelSigning: ${{ parameters.modelSigning }}

    - id: setup-monitoring
      name: 'Register the monitoring schedule'
      action: orchestration:setup-monitoring
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ parameters.modelVersion }}
        referenceDataUri: ${{ parameters.referenceDataUri }}
        productionDataSource: ${{ parameters.productionDataSource }}
        productionDataUri: ${{ parameters.productionDataUri }}
        schedule: ${{ parameters.schedule }}
        monitoringType: ${{ parameters.monitoringType }}
        driftThreshold: ${{ parameters.driftThreshold }}
        groundTruthDataUri: ${{ parameters.groundTruthDataUri }}
        groundTruthDataSource: ${{ parameters.groundTruthDataSource }}
        metricNames: ${{ parameters.metricNames }}
        metricThresholds: ${{ parameters.metricThresholds }}
        onDriftDetected: ${{ parameters.onDriftDetected }}
        retrainRequestJson: >-
          {"model_name":"${{ parameters.modelName }}","dataset_uri":"${{
          parameters.referenceDataUri }}","task_type":"${{
          parameters.taskType }}","algorithm":"${{
          parameters.retrainAlgorithm }}"}

  output:
    # Pre-flight FinOps recap — the same estimate/gate the form panel showed,
    # surfaced on the task result. Values are empty when the estimate step was
    # skipped (e.g. a non-deploy action); the card then renders nothing.
    costGoldenPath: setup-model-monitoring
    costStage: run
    costEstimated: ${{ steps['estimate-cost'].output.estimatedCost }}
    costLevel: ${{ steps['cost-gate'].output.level }}
    costBudget: ${{ steps['cost-gate'].output.budget }}
    costReasons: ${{ steps['cost-gate'].output.reasons }}
    costAlternatives: ${{ steps['cost-gate'].output.alternatives }}
    securityScore: ${{ steps['security-scan'].output.score }}
    securityPassed: ${{ steps['security-scan'].output.passed }}
    links:
      - title: View monitoring runs in MLflow
        url: http://localhost:5000
      - title: View this model version in MLflow
        url: http://localhost:5000/#/models/${{ parameters.modelName }}/${{ parameters.modelVersion }}
    text:
      - title: Result
        content: |
          Monitoring scheduled for **${{ parameters.modelName }}** version
          **${{ parameters.modelVersion }}** — CronWorkflow
          `${{ steps['setup-monitoring'].output.cronWorkflowName }}` runs
          on `${{ parameters.schedule }}` using the
          **${{ parameters.monitoringType }}** signal. Data-drift uses a
          drift-share threshold of **${{ parameters.driftThreshold }}**;
          performance-degradation monitors
          **${{ steps['setup-monitoring'].output.metricNamesSummary }}**
          against each metric's own threshold.
          Response: **${{ parameters.onDriftDetected }}**.

          Security posture: **${{ steps['security-scan'].output.score }}/100** —
          audit trail and compliance reporting are enforced.
