---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf: [guests]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns and operates the AI Delivery Portal.
spec:
  type: team
  children: []
---
# Deploys via evaluate-deploy-model (Golden Path #2, MLflow-registered
# models). No infra-level tenant boundary anymore — the backend repo's real
# OpenChoreoInferenceAdapter deploys to the one shared "serving" Component
# regardless of owner group (see adapters/factory.py's get_inference_adapter
# docstring); this Group exists only as the Catalog spec.owner for
# MLflow-registered models. ArgoCD AppProject / Kargo Warehouse per-team
# tenancy was retired when this repo moved fully to OpenChoreo.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: mlops-team
  description: Registers and deploys MLflow-tracked models via Golden Path #2.
spec:
  type: team
  children: []
---
# Deploys via llm-serve-deploy ("Serving LLM"). Same no-per-team-tenant
# situation as mlops-team above — real GPU serving (GpuKServeInferenceAdapter)
# defaults to namespace="default" and has no OpenChoreo ClusterComponentType
# yet (see infra/llm-serving/README.md); this Group exists only as the
# Catalog spec.owner for self-hosted LLM entries.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: llmops-team
  description: Serves self-hosted LLMs via vLLM/KServe.
spec:
  type: team
  children: []
