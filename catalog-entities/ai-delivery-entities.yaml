---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ai-delivery-portal
  description: >
    Internal Developer Platform for MLOps/LLMOps — Backstage Portal +
    orchestration-api + MCP servers + Adapter layer, wired to real local
    infrastructure (MLflow, Qdrant, Prometheus, Keycloak).
  annotations:
    # Docs (architecture, troubleshooting, glossary) live in the separate
    # backend repo (mkdocs.yml + docs/ at its root), not co-located with
    # this entity's own Location — a URL ref instead of dir:. avoids a
    # relative path across repo boundaries (fragile: only valid when both
    # repos happen to be checked out as local siblings, and meaningless in
    # CI/production). Requires that repo's main branch to actually have
    # mkdocs.yml + docs/ pushed — see its own CLAUDE.md.
    backstage.io/techdocs-ref: url:https://github.com/cuongct924/AI-delivery-portal-backend/tree/main/
spec:
  owner: group:platform-team
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orchestration-api
  description: >
    FastAPI BFF — MCP client, Keycloak auth, LLMOps evaluations, and the
    real business logic every Golden Path action calls into.
  annotations:
    # Metric scraped in infra/monitoring/prometheus.yml, grouped by handler.
    prometheus.io/rule: 'sum(rate(http_requests_total{job="orchestration-api"}[5m])) by (handler)|handler'
    # Real provisioned dashboard — no model-level/KServe data (see infra/monitoring/README.md).
    grafana/overview-dashboard: "http://localhost:3001/d/orchestration-api/orchestration-api?kiosk"
spec:
  type: service
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  providesApis: [orchestration-api-openapi]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ai-observability-server
  description: >
    MCP server — read-only AI/ML/LLM health tools (MLflow, model latency,
    LiteLLM spend, prompt/RAG active version). Infra tools (k8s, PromQL,
    promotion) live in OpenChoreo's own MCP servers. streamable-http,
    discovered via this Catalog, not a hardcoded local path.
spec:
  type: service
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  providesApis: [ai-observability-mcp]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: llmops-golden-paths-server
  description: >
    MCP server — the 6 LLMOps Lifecycle Golden Path actions (prompt/RAG
    draft, evaluate, activate), callable by any MCP-compatible AI Agent,
    not just through this Portal's UI. Renamed from golden-paths-server
    for domain-naming symmetry with mlops-golden-paths-server.
spec:
  type: service
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  providesApis: [llmops-golden-paths-mcp]
  consumesApis: [orchestration-api-openapi]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mlops-golden-paths-server
  description: >
    MCP server — the 5 MLOps Lifecycle Golden Path actions
    (validate_dataset, trigger_training, register_model, prepare_deploy,
    prepare_llm_deploy), callable by any MCP-compatible AI Agent, not just
    through this Portal's UI. Separate server (not folded into
    llmops-golden-paths-server) so each domain has its own Thunder client
    identity and mutate scope.
spec:
  type: service
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  providesApis: [mlops-golden-paths-mcp]
  consumesApis: [orchestration-api-openapi]
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: golden-path-guide-server
  description: >
    MCP server — read-only "how do I run Golden Path X" lookup, reading
    the live Catalog Template entities (not a RAG index) so it never goes
    stale.
spec:
  type: service
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  providesApis: [golden-path-guide-mcp]
  consumesApis: [orchestration-api-openapi]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: orchestration-api-openapi
  description: orchestration-api's REST API (FastAPI-generated OpenAPI schema).
spec:
  type: openapi
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  definition:
    $text: http://localhost:8000/openapi.json
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ai-observability-mcp
  description: >
    Read-only AI/ML/LLM MCP tools — MLOps: list_experiments,
    get_model_metrics, check_model_latency. LLMOps: get_llm_spend,
    get_active_prompt_version, get_active_rag_version,
    get_eval_score_trend (mock). Infra tools (k8s pod/logs, PromQL,
    promotion) are served by OpenChoreo's own MCP servers.
  annotations:
    mcp/endpoint: http://ai-observability-server:9001/mcp
    mcp/transport: streamable-http
spec:
  # "mcp" is a self-invented type — no Backstage-native support yet.
  type: mcp
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  definition: |
    MCP tools exposed by agents/mcp-servers/ai-observability-server/server.py.
    All read-only (ToolAnnotations.read_only_hint=True) — this server never
    mutates state.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: llmops-golden-paths-mcp
  description: >
    LLMOps Lifecycle MCP tools: draft_prompt, evaluate_prompt,
    activate_prompt, rag_ingest, rag_evaluate, rag_activate, draft_eval_set.
  annotations:
    mcp/endpoint: http://llmops-golden-paths-server:9002/mcp
    mcp/transport: streamable-http
spec:
  type: mcp
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  definition: |
    MCP tools exposed by
    agents/mcp-servers/llmops-golden-paths-server/server.py.
    activate_prompt/rag_activate are tagged destructive_hint=True — LLMOps
    activation is Instant with no PR-gate, so a calling Agent must treat
    these as propose-then-confirm, never auto-executable. The server
    itself also enforces this (confirm param + Thunder token scope check,
    not just a client-side convention) — see that file's README.md.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: mlops-golden-paths-mcp
  description: >
    MLOps Lifecycle MCP tools: validate_dataset, trigger_training,
    register_model, prepare_deploy, prepare_llm_deploy.
  annotations:
    mcp/endpoint: http://mlops-golden-paths-server:9004/mcp
    mcp/transport: streamable-http
spec:
  type: mcp
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  definition: |
    MCP tools exposed by
    agents/mcp-servers/mlops-golden-paths-server/server.py.
    validate_dataset is read-only. trigger_training/register_model/
    prepare_deploy/prepare_llm_deploy are tagged destructive_hint=True —
    real compute spend, a new registered model version, or production
    traffic changes — so a calling Agent must treat these as
    propose-then-confirm, never auto-executable. The server itself also
    enforces this (confirm param + Thunder token scope check, not just a
    client-side convention) — see that file's README.md.
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: golden-path-guide-mcp
  description: >
    Read-only MCP tools: list_golden_paths, get_golden_path_guide —
    "how do I run Golden Path X" lookup against the live Catalog.
  annotations:
    mcp/endpoint: http://golden-path-guide-server:9003/mcp
    mcp/transport: streamable-http
spec:
  type: mcp
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  definition: |
    MCP tools exposed by
    agents/mcp-servers/golden-path-guide-server/server.py. Both
    read-only (ToolAnnotations.read_only_hint=True) — this server never
    mutates state.
---
# Sample data for the Catalog's Kind=Resource / type=ml-model filter — a
# real Golden Path #1 run produces the exact same shape (see
# examples/templates/train-track-register/skeleton/catalog-info.yaml), but
# only after its Catalog-entry PR is merged. These two are hand-added so
# there's something to see before that's happened; delete once real
# merged entries exist.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: fraud-detection
  description: "Model registered via Golden Path #1 (Train -> Track -> Register)"
  tags:
    - ml-model
    - mlops
  annotations:
    mlflow.org/model-version: "2"
spec:
  type: ml-model
  owner: group:mlops-team
  system: ai-delivery-portal
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: churn-prediction
  description: "Model registered via Golden Path #1 (Train -> Track -> Register)"
  tags:
    - ml-model
    - mlops
  annotations:
    mlflow.org/model-version: "1"
spec:
  type: ml-model
  owner: group:mlops-team
  system: ai-delivery-portal
---
# The actual consumer of the prompt Resource below — makes its
# "dependencyOf" relation (and thus the Prompts list's "App liên kết"
# column) point at something real instead of an invented placeholder.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mcp-chat
  description: >
    Portal-native chat UI (@backstage-community/plugin-mcp-chat) — talks to
    the LiteLLM gateway and the llmops-golden-paths/mlops-golden-paths/
    observability MCP servers via
    services/orchestration-api/routers/chat.py, using the "mlops" prompt
    below as its system prompt (tool list filtered server-side —
    persona_tool_scope.py). The "k8s" persona was removed — OpenChoreo's
    own built-in MCP server now covers pod/log/event lookups.
spec:
  type: service
  lifecycle: experimental
  owner: group:platform-team
  system: ai-delivery-portal
  dependsOn: [resource:default/mlops]
---
# Sample data for the Catalog's Kind=Resource / type=prompt filter — a real
# prompt draft (POST /prompts) will register into MLflow's Prompt Registry
# once routers/prompts.py is backed by MlflowPromptRegistryAdapter, but
# isn't yet synced into this Catalog as an entity (no Catalog provider for
# it exists). Hand-added, same reasoning as fraud-detection/churn-prediction
# above — delete once a real sync exists.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mlops
  description: "MLOps Assistant persona prompt — see services/orchestration-api/routers/prompts.py"
  tags:
    - prompt
    - llmops
  annotations:
    mlflow.org/prompt-version: "1"
    mlflow.org/prompt-alias: production
    # Hand-set, not live — see this block's top comment.
    viettel.ai/updated-at: "2026-09-06"
spec:
  type: prompt
  owner: group:mlops-team
  system: ai-delivery-portal
