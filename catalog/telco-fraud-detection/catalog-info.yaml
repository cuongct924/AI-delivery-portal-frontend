# Mirrors examples/catalog/model-entity.yaml's shape (kind: Resource — a
# model is an artifact, not code), templated by ../template.yaml.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: telco-fraud-detection
  description: "Model registered via Golden Path #1 (Train -> Track -> Register)"
  tags:
    - ml-model
    - mlops
  annotations:
    # No existing annotation-key convention for this — chosen to sit
    # alongside MlflowAdapter's mlflow.org/* tags.
    mlflow.org/model-version: 3
    # Catalog-only business metadata (Phase 1) — not forwarded to
    # orchestration-api/MLflow yet, see train-track-register/template.yaml's
    # businessDomain/useCase fields.
    viettel.vn/business-domain: fraud-risk
    viettel.vn/use-case: telco-fraud-detection
spec:
  type: ml-model
  owner: group:mlops-team
